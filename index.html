<title>یادداشت پرونده‌ها</title>
<style>
:root{--bg:#fafafa;--card:#fff;--text:#18181b;--muted:#8a8f98;--line:#ececef;--accent:#2f6fed;--onaccent:#fff;--new:#dc2626}
@media (prefers-color-scheme:dark){:root{--bg:#0f1114;--card:#17191d;--text:#eceff3;--muted:#8d95a1;--line:#24272d;--accent:#5b9bff;--onaccent:#0b1220;--new:#f87171}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Tahoma,"Segoe UI",sans-serif;font-size:16px;line-height:1.7;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:640px;margin:0 auto;padding:12px}
h1{font-size:20px;margin:8px 0}
input,textarea,button,select{font:inherit;color:inherit}
select{width:100%;padding:10px 6px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:inherit;font:inherit}
input,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
textarea{min-height:90px;resize:vertical}
button{border:0;border-radius:10px;padding:10px 16px;background:var(--accent);color:var(--onaccent);cursor:pointer}
button.ghost{background:transparent;color:var(--accent);padding:6px 0}
button.del{background:transparent;color:var(--new);padding:2px 0;font-size:13px}
.acts{display:flex;gap:14px;flex-shrink:0}
.acts button{padding:2px 0;font-size:13px}
.foot .meta{margin-top:0}
.thumbs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.thumbs img{width:88px;height:88px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:pointer;background:var(--bg)}
.pv{position:relative}
.pv img{cursor:default}
.pv .x{position:absolute;top:2px;left:2px;width:22px;height:22px;padding:0;border-radius:99px;background:rgba(0,0,0,.65);color:#fff;font-size:15px;line-height:22px}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:20;display:flex;align-items:center;justify-content:center;padding:8px}
.lb img{max-width:100%;max-height:100%;object-fit:contain}
.frow{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:6px 10px;margin-top:6px;font-size:14px}
.frow .fn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr;text-align:right;flex:1}
.frow button{padding:2px 8px;font-size:13px}
.frow button.x2{background:transparent;color:var(--new)}
.export{position:fixed;inset:0;z-index:15;overflow:auto;background:#fff;color:#111;padding:14px;padding-top:calc(14px + env(safe-area-inset-top,0px))}
.export .meta{color:#555}
.export h2{margin:6px 0}
.export .en{border-top:1px solid #ccc;padding:10px 0;break-inside:avoid}
.export .en img{max-width:48%;max-height:9cm;object-fit:contain;margin:4px;border:1px solid #ccc;border-radius:6px}
.export .bar2{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
@media print{body>*:not(.export){display:none!important}.export{position:static!important;overflow:visible!important;padding:0}.noprint{display:none!important}}
.rep{background:#fff;color:#111;padding:24px;font-family:Tahoma,"Segoe UI",sans-serif;font-size:15px;line-height:1.8;direction:rtl}
.rep h2{margin:0 0 4px;font-size:22px}
.rep h3{margin:2px 0 6px;font-size:17px}
.rep .meta{color:#555;font-size:13px;margin-top:0}
.rep .en{border-top:1px solid #ccc;padding:10px 0}
.rep .en img{max-width:48%;max-height:9cm;object-fit:contain;margin:4px;border:1px solid #ccc;border-radius:6px}
button:disabled{opacity:.5}
.row{display:flex;gap:8px;margin:8px 0}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0}
.case{cursor:pointer}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.num{font-weight:700}
.meta{color:var(--muted);font-size:13px;margin-top:4px}
.badge{background:var(--new);color:#fff;border-radius:99px;font-size:12px;padding:1px 8px}
.prev{color:var(--muted);font-size:14px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note{white-space:pre-wrap;word-break:break-word;margin:0}
.empty{color:var(--muted);text-align:center;padding:24px 0}
.toast{position:fixed;inset:auto 12px calc(12px + env(safe-area-inset-bottom,0px)) 12px;max-width:616px;margin:0 auto;background:var(--accent);color:var(--onaccent);padding:10px 14px;border-radius:12px;z-index:9}
.av{border-radius:50%;object-fit:cover;background:var(--accent);color:var(--onaccent);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;border:1px solid var(--line)}
.chrow{display:flex;align-items:center;gap:10px}
.ci{flex:1;min-width:0}
.ci .prev{margin-top:0}
.msgs{display:flex;flex-direction:column;gap:8px;padding:8px 0;min-height:40vh}
.bub{max-width:82%;padding:8px 12px;border-radius:14px;background:var(--card);border:1px solid var(--line);align-self:flex-end;word-break:break-word}
.bub.mine{align-self:flex-start;background:var(--accent);color:var(--onaccent);border-color:var(--accent)}
.bub .who{font-size:12px;font-weight:700;margin-bottom:2px;color:var(--accent)}
.bub .tm{font-size:11px;opacity:.75;margin-top:2px;display:flex;gap:10px;justify-content:space-between;align-items:center}
.bub img.ph{max-width:100%;max-height:260px;border-radius:10px;display:block;margin:4px 0;cursor:pointer}
.bub a.fl{display:block;color:inherit;text-decoration:underline;direction:ltr;text-align:right;margin:4px 0;word-break:break-all}
.bub button.bd{background:transparent;color:inherit;padding:0;font-size:11px;opacity:.85}
.bub.new{animation:bubin .22s cubic-bezier(.2,.8,.3,1)}
.bub.mine.new{transform-origin:top right}
.bub:not(.mine).new{transform-origin:top left}
@keyframes bubin{from{opacity:0;transform:translateY(14px) scale(.9)}to{opacity:1;transform:none}}
.bub.pend{opacity:.7}
.bub.fail{border-color:#c0392b}
.bub.gone{transition:opacity .18s,transform .18s;opacity:0;transform:scale(.85)}
.bub .st{font-size:11px}
@media (prefers-reduced-motion:reduce){.bub.new{animation:none}}
.cmp{position:sticky;bottom:0;background:var(--bg);padding:8px 0;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}
.cmp textarea{min-height:44px;height:44px;flex:1}
.cmp .row{align-items:flex-end;margin:0}
.cmp .row button{flex-shrink:0}
.pbox{display:flex;flex-direction:column;align-items:center;gap:10px}

/* ===== نسخه ۱۵: تم مینیمال + چت شبیه تلگرام ===== */
:root{--chatbg:#eef1f4;--bin:#fff;--bout:#dbe9ff;--btext:#18181b;--tick:#2f6fed}

body{font-size:15px;line-height:1.6}
h1{font-size:18px;font-weight:600;margin:6px 0}
button{border-radius:8px;font-size:15px;font-weight:500;padding:9px 16px;transition:opacity .15s,transform .1s}

.card{border-radius:10px;padding:12px 14px}

.thumbs img{border-radius:6px}
.tbar{display:flex;align-items:center;gap:8px;margin-bottom:8px}

.ico{display:inline-flex}

body.chatbody{background:var(--chatbg)}
.wrap.chat{max-width:640px;padding:0;min-height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column}
.chead{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:6px 8px;background:var(--card);border-bottom:1px solid var(--line)}
.chead .ct{min-width:0;flex:1}
.chead .cn{font-weight:600;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chead .cs{font-size:12px;color:var(--muted);line-height:1.3}
.wrap.chat .msgs{flex:1;min-height:0;gap:2px;padding:10px 10px 8px}
.dsep{align-self:center;margin:10px 0 6px}
.dsep span{display:inline-block;background:rgba(120,130,145,.22);color:var(--muted);font-size:12px;padding:1px 12px;border-radius:99px}
.bub{max-width:80%;padding:6px 10px 4px;border-radius:14px;background:var(--bin);color:var(--btext);border:0;box-shadow:0 1px 1px rgba(0,0,0,.06);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.bub.mine{background:var(--bout);color:var(--btext);border:0}
.bub.first{margin-top:8px}
.bub.mine.last{border-bottom-right-radius:4px}
.bub:not(.mine).last{border-bottom-left-radius:4px}
.bub:not(.first) .who{display:none}
.bub .who{font-size:13px;font-weight:600;margin-bottom:1px}
.bub .tm{display:flex;justify-content:flex-end;align-items:center;gap:6px;font-size:11px;opacity:.65;margin-top:0;line-height:1.4}
.bub .st{color:var(--tick);font-size:12px}
.bub.fail{outline:1px solid #c0392b}
.bub.mine.new{transform-origin:bottom right}
.bub:not(.mine).new{transform-origin:bottom left}
@keyframes bubin{from{opacity:0;transform:translateY(18px) scale(.9)}to{opacity:1;transform:none}}
.bub img.ph{border-radius:10px}
.cmp{position:sticky;bottom:0;background:transparent;padding:6px 8px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px))}
.cmp .frow{background:var(--card)}
.cbox{display:flex;align-items:flex-end;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:4px}
.cmp .cbox textarea{flex:1;min-height:36px;height:36px;max-height:120px;border:0;background:transparent;padding:7px 6px;resize:none;line-height:1.5;border-radius:0}
.cbox .ibtn{width:38px;height:38px;color:var(--muted)}
.sendb{width:38px;height:38px;padding:0;border-radius:50%;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;background:var(--line);color:var(--muted);transition:background .15s,color .15s,transform .15s}
.sendb .ico{transform:scaleX(-1)}
.sendb.on{background:var(--accent);color:var(--onaccent)}
.sendb.pop{animation:pop .2s ease}
@keyframes pop{50%{transform:scale(.8)}}
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:640px;background:var(--card);border-radius:16px 16px 0 0;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));animation:sheetin .18s ease-out}
@keyframes sheetin{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet .sb{display:block;width:100%;background:transparent;color:var(--text);text-align:right;padding:13px 14px;border-radius:10px;font-size:16px}
.sheet .sb:active{background:var(--line)}
.sheet .sb.dg{color:var(--new)}
/* فهرست چت */
.clist{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.clist .meta{margin:0;padding:8px 14px;background:var(--bg)}
.clist .empty{padding:16px 0}
.crow2{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.crow2:last-child{border-bottom:0}
.crow2:active{background:var(--bg)}
.crow2 .ci{flex:1;min-width:0}
.crt,.crb{display:flex;align-items:center;gap:8px}
.crt .cn{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crt .ctm{font-size:12px;color:var(--muted);flex-shrink:0}
.crb .prev{flex:1;min-width:0;margin-top:0}
.cn.ub,.prev.ub{color:var(--text);font-weight:700}
.udot{width:10px;height:10px;border-radius:50%;background:var(--accent);flex-shrink:0}
</style>
</head>

async function makePdf(build){

function jParts(d){var o={};new Intl.DateTimeFormat('en-u-ca-persian-nu-latn',{year:'numeric',month:'numeric',day:'numeric'}).formatToParts(d).forEach(function(x){o[x.type]=x.value});return {y:+o.year,m:+o.month,d:+o.day}}
function jOrd(p){return p.y*372+(p.m-1)*31+p.d}
function jToG(jy,jm,jd){

 var t=new Date(jy+621,2,21+off,12,0,0),tg=jOrd({y:jy,m:jm,d:jd});
 for(var i=0;i<8;i++){var c=jOrd(jParts(t));if(c===tg)break;t=new Date(t.getFullYear(),t.getMonth(),t.getDate()+(tg>c?1:-1),12,0,0)}
 return t;

async function zipCase(c){
 var list=notes.slice().reverse();
 var tt=h('div',{class:'toast',text:'در حال آماده‌سازی آرشیو…'});document.body.appendChild(tt);
 var missing=[];
 try{
  if(!window.JSZip)await loadScript('https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js');
  var zip=new JSZip(),used={},total=0,done=0;
  list.forEach(function(n){total+=(n.images||[]).length+(n.files||[]).length});
  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
  function safe(s){return String(s||'file').replace(/[\\\/:*?"<>|\r\n]/g,'-')}
  function uniq(path){
   if(!used[path]){used[path]=1;return path}
   var sl=path.lastIndexOf('/'),d=path.lastIndexOf('.'),has=d>sl,b=has?path.slice(0,d):path,e=has?path.slice(d):'',i=2;
   while(used[b+'-'+i+e])i++;used[b+'-'+i+e]=1;return b+'-'+i+e;
  }
  async function grab(path,dest){
   try{
    var r=await sb.storage.from(BUCKET).download(path);
    if(r.error||!r.data)throw (r.error||new Error('dl'));
    zip.file(dest,r.data);
    return true;
   }catch(e){missing.push(dest);return false}
   finally{done++;tt.textContent='در حال دریافت فایل‌ها… '+done+' از '+total}
  }
  var title='پرونده '+c.number+(c.title?' — '+c.title:'');
  var T=[title,'تاریخ خروجی: '+fmt(Date.now()),''];
  var H='<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><title>'+esc(title)+'</title>'
   +'<style>body{font-family:Tahoma,sans-serif;max-width:820px;margin:auto;padding:16px;line-height:1.7}.en{border-top:1px solid #ccc;padding:10px 0}.m{color:#555;font-size:13px}pre{white-space:pre-wrap;font-family:inherit;margin:6px 0}img{max-width:48%;max-height:9cm;object-fit:contain;margin:4px;border:1px solid #ccc;border-radius:6px}</style></head><body>'
   +'<h2>'+esc(title)+'</h2><div class="m">تاریخ خروجی: '+esc(fmt(Date.now()))+'</div>';
  for(var i=0;i<list.length;i++){
   var n=list[i],tag='note'+('0'+(i+1)).slice(-2).replace(/^0(\d\d)$/,'$1');
   tag='note'+(i+1<10?'0':'')+(i+1);
   var head='— '+fmt(n.created_at)+' ('+nm(n.author_id)+')'+(n.edited_at?' [ویرایش‌شده]':'');
   T.push(head);T.push(n.body||'');
   H+='<div class="en"><div class="m">'+esc(head.replace(/^— /,''))+'</div><pre>'+esc(n.body)+'</pre>';
   var imgs=n.images||[];
   for(var j=0;j<imgs.length;j++){
    var dest=uniq('photos/'+tag+'-'+(j+1)+'.jpg');
    var ok=await grab(imgs[j],dest);
    if(ok){T.push('عکس: '+dest);H+='<a href="'+esc(dest)+'"><img src="'+esc(dest)+'"></a>'}
   }
   var fls=n.files||[];
   for(var k=0;k<fls.length;k++){
    var f=fls[k],d2=uniq('files/'+tag+'-'+safe(f.name));
    var ok2=await grab(f.path,d2);
    if(ok2){T.push('پیوست: '+d2);H+='<div class="m">📎 <a href="'+esc(d2)+'">'+esc(f.name)+'</a></div>'}
   }
   T.push('');H+='</div>';
  }
  if(!list.length){T.push('یادداشتی ثبت نشده است');H+='<p>یادداشتی ثبت نشده است</p>'}
  if(missing.length){T.push('');T.push('این فایل‌ها دریافت نشدند:');missing.forEach(function(x){T.push(x)})}
  H+='</body></html>';
  zip.file('notes.txt','\ufeff'+T.join('\r\n'));
  zip.file('notes.html','\ufeff'+H);
  var blob=await zip.generateAsync({type:'blob',compression:'STORE'},function(m){tt.textContent='در حال ساخت ZIP… '+Math.round(m.percent)+'٪'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='case-'+safe(c.number)+'-archive.zip';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(a.href)},60000);
  toast(missing.length?('آرشیو ساخته شد؛ '+missing.length+' فایل دریافت نشد'):'آرشیو ساخته شد؛ در پوشه‌ی دانلودها ذخیره می‌شود');
 }catch(e){toast('ساخت آرشیو انجام نشد: '+((e&&e.message)||''))}
 tt.remove();
}

 if(el&&el.classList.contains('gone'))return;
 var i=-1;for(var k=0;k<chatMsgs.length;k++){if(chatMsgs[k].id===id){i=k;break}}
 if(i>-1)chatMsgs.splice(i,1);
 if(el){el.classList.add('gone');setTimeout(function(){el.remove();if(!chatMsgs.length)drawMsgs();else relayout()},180)}
}
function hasMsg(id){for(var k=0;k<chatMsgs.length;k++){if(chatMsgs[k].id===id)return true}return false}
async function sendOut(id,t,fl){
 var tmp={sender_id:me,body:t||null,created_at:new Date().toISOString(),pending:true,pfiles:fl};
 var el=(chatRoom===id)?addBub(tmp,true):null;
 cpending++;
 try{
  var rows=[];
  if(!fl.length){
   var r=await sb.from('chat_messages').insert({room_id:id,sender_id:me,body:t}).select().single();
   if(r.error)throw r.error;
   rows.push(r.data);
  }else{
   for(var i=0;i<fl.length;i++){
    var f=fl[i],blob=f,name=f.name,type=f.type||'application/octet-stream';
    if(type.indexOf('image/')===0&&type!=='image/gif'){blob=await shrink(f);type='image/jpeg'}
    var path=id+'/'+uid()+'.'+(type==='image/jpeg'?'jpg':ext(name));
    var up=await sb.storage.from(CB).upload(path,blob,{contentType:type});
    if(up.error)throw up.error;
    var pu=sb.storage.from(CB).getPublicUrl(path).data.publicUrl;
    var r2=await sb.from('chat_messages').insert({room_id:id,sender_id:me,body:(i===0&&t)?t:null,file_url:pu,file_name:name,file_type:type}).select().single();
    if(r2.error)throw r2.error;
    rows.push(r2.data);
   }
  }
  chatLast[id]=rows[rows.length-1];
  if(chatRoom===id){
   if(!fl.length&&el){
    var row=rows[0];
    el.setAttribute('data-mid',String(row.id));
    el.classList.remove('pend');
    var s=el.querySelector('.st');if(s)s.textContent='✓';
    attachMenu(row,el);
    if(!hasMsg(row.id))chatMsgs.push(row);
   }else{
    if(el)el.remove();
    rows.forEach(function(row){if(!hasMsg(row.id)){chatMsgs.push(row);addBub(row,true)}});
   }
  }
 }catch(e){
  if(el&&el.parentNode){
   el.classList.remove('pend');el.classList.add('fail');
   var s2=el.querySelector('.st');if(s2)s2.textContent=' ⚠️ ارسال نشد';
   var rt=h('button',{class:'bd',text:'تلاش دوباره'});
   rt.addEventListener('click',function(){el.remove();sendOut(id,t,fl)});
   el.querySelector('.tm').appendChild(rt);
  }else{toast('ارسال انجام نشد: '+((e&&e.message)||''))}
 }
 cpending--;
}
function drawMsgs(){
 var box=document.getElementById('msgs');if(!box)return;box.textContent='';
 if(!chatMsgs.length){box.appendChild(h('p',{class:'empty',text:'هنوز پیامی نیست؛ اولین پیام را بفرست'}));return}
 chatMsgs.forEach(function(m){box.appendChild(bubEl(m))});relayout();
 cseenSet(chatRoom,Date.now());
 scrollEnd(false);
}
function renderChatProfile(){
 resetApp();
 app.appendChild(h('button',{class:'ghost',text:'→ بازگشت',onclick:function(){renderChatList()}}));
 app.appendChild(h('h1',{text:'پروفایل من در چت'}));
 var cur=cprof[me]||{};
 var newBlob=null,prevUrl=null;
 var avBox=h('div',{});
 function drawAv(){
  avBox.textContent='';
  if(prevUrl)avBox.appendChild(h('img',{class:'av',style:'width:96px;height:96px',src:prevUrl}));
  else avBox.appendChild(avatar(me,96));
 }
 drawAv();
 var nameIn=h('input',{placeholder:'نام نمایشی',value:cur.full_name||names[me]||''});
 var fi=h('input',{type:'file',accept:'image/*',style:'display:none'});
 var pick=h('button',{class:'ghost',text:'📷 انتخاب عکس پروفایل'});
 var save=h('button',{text:'ذخیره'});
 pick.addEventListener('click',function(){fi.click()});
 fi.addEventListener('change',async function(){
  var f=fi.files&&fi.files[0];fi.value='';if(!f)return;
  try{newBlob=await shrink(f,400);if(prevUrl)URL.revokeObjectURL(prevUrl);prevUrl=URL.createObjectURL(newBlob);drawAv()}catch(e){toast('عکس خوانده نشد')}
 });
 save.addEventListener('click',async function(){
  var n=nameIn.value.trim();if(!n){toast('نام نمایشی را وارد کن');return}
  save.disabled=true;
  try{
   var url=cur.avatar_url||null;
   if(newBlob){
    var path='avatars/'+me+'/'+uid()+'.jpg';
    var up=await sb.storage.from(CB).upload(path,newBlob,{contentType:'image/jpeg'});
    if(up.error)throw up.error;
    url=sb.storage.from(CB).getPublicUrl(path).data.publicUrl;
   }
   var r=await sb.from('chat_profiles').upsert({id:me,full_name:n,avatar_url:url},{onConflict:'id'});
   if(r.error)throw r.error;
   await loadChatProfiles();toast('پروفایل ذخیره شد');renderChatList();
  }catch(e){toast('ذخیره انجام نشد: '+((e&&e.message)||''));save.disabled=false}
 });
 app.appendChild(h('div',{class:'card'},[h('div',{class:'pbox'},[avBox,pick,fi]),h('div',{class:'row'},[nameIn]),h('div',{class:'row'},[save])]));
}
async function onChatMsg(p){
 var m=p.new;if(!m)return;
 if(chatRoom===m.room_id){
  if(hasMsg(m.id))return;
  if(m.sender_id===me&&cpending>0)return;
  if(!cprof[m.sender_id])await loadChatProfiles();
  if(hasMsg(m.id))return;
  chatMsgs.push(m);chatLast[m.room_id]=m;
  addBub(m,true);
  return;
 }
 if(m.sender_id===me)return;
 if(!cprof[m.sender_id])await loadChatProfiles();
 toast(cname(m.sender_id)+' در چت پیام فرستاد');
 if(document.getElementById('chatlist')){await loadRooms();drawChatList()}else refreshChatBadge();
}
/* ============== پایان بخش چت ============== */

async function onNote(p){
 var n=p.new;if(!n)return;
 await loadProfiles();
 if(openId===n.case_id){await loadNotes();renderNotes();seenSet(openId,Date.now());return}
 await refreshCases();
 if(n.author_id!==me){var c=cases.filter(function(x){return x.id===n.case_id})[0];
  toast(nm(n.author_id)+' در پرونده '+(c?c.number:'')+' یادداشت گذاشت')}
}

function b64(s){var p='='.repeat((4-s.length%4)%4),b=(s+p).replace(/-/g,'+').replace(/_/g,'/'),r=atob(b),o=new Uint8Array(r.length);for(var i=0;i<r.length;i++)o[i]=r.charCodeAt(i);return o}
async function enablePush(){
 try{
  if(!('serviceWorker' in navigator)||!('PushManager' in window)){toast('اعلان روی این مرورگر پشتیبانی نمی‌شود');return}
  var perm=await Notification.requestPermission();
  if(perm!=='granted'){toast('اجازه‌ی اعلان داده نشد');return}
  var reg=await navigator.serviceWorker.ready;
  var sub=await reg.pushManager.getSubscription()||await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64(VAPID_PUBLIC_KEY)});
  var j=sub.toJSON();
  var r=await sb.from('push_subscriptions').upsert({endpoint:j.endpoint,subscription:j,user_id:me},{onConflict:'endpoint'});
  toast(r.error?'ثبت اعلان انجام نشد':'اعلان فعال شد');
 }catch(e){toast('فعال‌سازی اعلان انجام نشد')}
}

async function boot(){
 if('serviceWorker' in navigator){try{navigator.serviceWorker.register('sw.js')}catch(e){}}
 var s=await sb.auth.getSession();
 if(!s.data.session){renderLogin();return}
 me=s.data.session.user.id;
 await loadProfiles();await loadCases();renderList();
 sb.channel('app')
  .on('postgres_changes',{event:'*',schema:'public',table:'cases'},function(){clearTimeout(tmr);tmr=setTimeout(refreshCases,200)})
  .on('postgres_changes',{event:'INSERT',schema:'public',table:'notes'},onNote)
  .on('postgres_changes',{event:'UPDATE',schema:'public',table:'notes'},async function(){if(openId){await loadNotes();renderNotes()}await refreshCases()})
  .on('postgres_changes',{event:'DELETE',schema:'public',table:'notes'},async function(){if(openId){await loadNotes();renderNotes()}await refreshCases()})
  .on('postgres_changes',{event:'INSERT',schema:'public',table:'chat_messages'},onChatMsg)
  .on('postgres_changes',{event:'DELETE',schema:'public',table:'chat_messages'},async function(p){if(!chatRoom)return;var id=p.old&&p.old.id;if(id==null||id===undefined){await loadMsgs();drawMsgs();return}dropMsg(id)})
  .subscribe();
}
boot();
})();
</script>
