<title>Note</title>
<style>
:root{--bg:#fafafa;--card:#fff;--text:#18181b;--muted:#8a8f98;--line:#ececef;--accent:#2f6fed;--onaccent:#fff;--new:#dc2626}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;background:var(--bg);color:var(--text);font-family:Tahoma,"Segoe UI",sans-serif;font-size:16px;line-height:1.7;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:640px;margin:0 auto;padding:12px}
h1{font-size:20px;margin:8px 0}
input,textarea,button,select{font:inherit;color:inherit}
select{width:100%;padding:10px 6px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:inherit;font:inherit}
input,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
textarea{min-height:90px;resize:vertical}
button{border:0;border-radius:10px;padding:10px 16px;background:var(--accent);color:var(--onaccent);cursor:pointer}
button.ghost{background:transparent;color:var(--accent);padding:6px 0}
button.del{background:transparent;color:var(--new);padding:2px 0;font-size:13px}
.acts{display:flex;gap:14px;flex-shrink:0}
.acts button{padding:2px 0;font-size:13px}
.foot .meta{margin-top:0}
.thumbs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.thumbs img{width:88px;height:88px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:pointer;background:var(--bg)}
.pv{position:relative}
.pv img{cursor:default}
.pv .x{position:absolute;top:2px;left:2px;width:22px;height:22px;padding:0;border-radius:99px;background:rgba(0,0,0,.65);color:#fff;font-size:15px;line-height:22px}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:20;display:flex;align-items:center;justify-content:center;padding:8px}
.lb img{max-width:100%;max-height:100%;object-fit:contain}
.frow{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:6px 10px;margin-top:6px;font-size:14px}
.frow .fn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr;text-align:right;flex:1}
.frow button{padding:2px 8px;font-size:13px}
.frow button.x2{background:transparent;color:var(--new)}
.export{position:fixed;inset:0;z-index:15;overflow:auto;background:#fff;color:#111;padding:14px;padding-top:calc(14px + env(safe-area-inset-top,0px))}
.export .meta{color:#555}
.export h2{margin:6px 0}
.export .en{border-top:1px solid #ccc;padding:10px 0;break-inside:avoid}
.export .en img{max-width:48%;max-height:9cm;object-fit:contain;margin:4px;border:1px solid #ccc;border-radius:6px}
.export .bar2{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
@media print{body>*:not(.export){display:none!important}.export{position:static!important;overflow:visible!important;padding:0}.noprint{display:none!important}}
.rep{background:#fff;color:#111;padding:24px;font-family:Tahoma,"Segoe UI",sans-serif;font-size:15px;line-height:1.8;direction:rtl}
.rep h2{margin:0 0 4px;font-size:22px}
.rep h3{margin:2px 0 6px;font-size:17px}
.rep .meta{color:#555;font-size:13px;margin-top:0}
.rep .en{border-top:1px solid #ccc;padding:10px 0}
.rep .en img{max-width:48%;max-height:9cm;object-fit:contain;margin:4px;border:1px solid #ccc;border-radius:6px}
button:disabled{opacity:.5}
.row{display:flex;gap:8px;margin:8px 0}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0}
.case{cursor:pointer}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.num{font-weight:700}
.meta{color:var(--muted);font-size:13px;margin-top:4px}
.badge{background:var(--new);color:#fff;border-radius:99px;font-size:12px;padding:1px 8px}
.prev{color:var(--muted);font-size:14px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note{white-space:pre-wrap;word-break:break-word;margin:0}
.empty{color:var(--muted);text-align:center;padding:24px 0}
.toast{position:fixed;inset:auto 12px calc(12px + env(safe-area-inset-bottom,0px)) 12px;max-width:616px;margin:0 auto;background:var(--accent);color:var(--onaccent);padding:10px 14px;border-radius:12px;z-index:9}
.av{border-radius:50%;object-fit:cover;background:var(--accent);color:var(--onaccent);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;border:1px solid var(--line)}
.chrow{display:flex;align-items:center;gap:10px}
.ci{flex:1;min-width:0}
.ci .prev{margin-top:0}
.msgs{display:flex;flex-direction:column;gap:8px;padding:8px 0;min-height:40vh}
.bub{max-width:82%;padding:8px 12px;border-radius:14px;background:var(--card);border:1px solid var(--line);align-self:flex-end;word-break:break-word}
.bub.mine{align-self:flex-start;background:var(--accent);color:var(--onaccent);border-color:var(--accent)}
.bub .who{font-size:12px;font-weight:700;margin-bottom:2px;color:var(--accent)}
.bub .tm{font-size:11px;opacity:.75;margin-top:2px;display:flex;gap:10px;justify-content:space-between;align-items:center}
.bub img.ph{max-width:100%;max-height:260px;border-radius:10px;display:block;margin:4px 0;cursor:pointer}
.bub a.fl{display:block;color:inherit;text-decoration:underline;direction:ltr;text-align:right;margin:4px 0;word-break:break-all}
.bub button.bd{background:transparent;color:inherit;padding:0;font-size:11px;opacity:.85}
.bub.new{animation:bubin .22s cubic-bezier(.2,.8,.3,1)}
.bub.mine.new{transform-origin:top right}
.bub:not(.mine).new{transform-origin:top left}
@keyframes bubin{from{opacity:0;transform:translateY(14px) scale(.9)}to{opacity:1;transform:none}}
.bub.pend{opacity:.7}
.bub.fail{border-color:#c0392b}
.bub.gone{transition:opacity .18s,transform .18s;opacity:0;transform:scale(.85)}
.bub .st{font-size:11px}
@media (prefers-reduced-motion:reduce){.bub.new{animation:none}}
.cmp{position:sticky;bottom:0;background:var(--bg);padding:8px 0;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}
.cmp textarea{min-height:44px;height:44px;flex:1}
.cmp .row{align-items:flex-end;margin:0}
.cmp .row button{flex-shrink:0}
.pbox{display:flex;flex-direction:column;align-items:center;gap:10px}

/* ===== نسخه ۱۵: تم مینیمال + چت شبیه تلگرام ===== */
:root{--chatbg:#eef1f4;--bin:#fff;--bout:#dbe9ff;--btext:#18181b;--tick:#2f6fed}
body{font-size:15px;line-height:1.6}
h1{font-size:18px;font-weight:600;margin:6px 0}
button{border-radius:8px;font-size:15px;font-weight:500;padding:9px 16px;transition:opacity .15s,transform .1s}
button:active{transform:scale(.97)}
input,textarea,select{border-radius:8px;outline:none;transition:border-color .15s}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
.card{border-radius:10px;padding:12px 14px}
.toast{background:var(--text);color:var(--bg);border-radius:10px;font-size:14px}
.thumbs img{border-radius:6px}
.tbar{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.tbar h1{flex:1;margin:0}
.ibtn{background:transparent;color:var(--text);width:40px;height:40px;padding:0;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.ibtn:active{background:var(--line)}
.ico{display:inline-flex}
/* حالت چت */
body.chatbody{background:var(--chatbg)}
.wrap.chat{max-width:640px;padding:0;min-height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column}
.chead{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:6px 8px;background:var(--card);border-bottom:1px solid var(--line)}
.chead .ct{min-width:0;flex:1}
.chead .cn{font-weight:600;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chead .cs{font-size:12px;color:var(--muted);line-height:1.3}
.wrap.chat .msgs{flex:1;min-height:0;gap:2px;padding:10px 10px 8px}
.dsep{align-self:center;margin:10px 0 6px}
.dsep span{display:inline-block;background:rgba(120,130,145,.22);color:var(--muted);font-size:12px;padding:1px 12px;border-radius:99px}
.bub{max-width:80%;padding:6px 10px 4px;border-radius:14px;background:var(--bin);color:var(--btext);border:0;box-shadow:0 1px 1px rgba(0,0,0,.06);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.bub.mine{background:var(--bout);color:var(--btext);border:0}
.bub.first{margin-top:8px}
.bub.mine.last{border-bottom-right-radius:4px}
.bub:not(.mine).last{border-bottom-left-radius:4px}
.bub:not(.first) .who{display:none}
.bub .who{font-size:13px;font-weight:600;margin-bottom:1px}
.bub .tm{display:flex;justify-content:flex-end;align-items:center;gap:6px;font-size:11px;opacity:.65;margin-top:0;line-height:1.4}
.bub .st{color:var(--tick);font-size:12px}
.bub.fail{outline:1px solid #c0392b}
.bub.mine.new{transform-origin:bottom right}
.bub:not(.mine).new{transform-origin:bottom left}
@keyframes bubin{from{opacity:0;transform:translateY(18px) scale(.9)}to{opacity:1;transform:none}}
.bub img.ph{border-radius:10px}
.cmp{position:sticky;bottom:0;background:transparent;padding:6px 8px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px))}
.cmp .frow{background:var(--card)}
.cbox{display:flex;align-items:flex-end;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:4px}
.cmp .cbox textarea{flex:1;min-height:36px;height:36px;max-height:120px;border:0;background:transparent;padding:7px 6px;resize:none;line-height:1.5;border-radius:0}
.cbox .ibtn{width:38px;height:38px;color:var(--muted)}
.sendb{width:38px;height:38px;padding:0;border-radius:50%;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;background:var(--line);color:var(--muted);transition:background .15s,color .15s,transform .15s}
.sendb .ico{transform:scaleX(-1)}
.sendb.on{background:var(--accent);color:var(--onaccent)}
.sendb.pop{animation:pop .2s ease}
@keyframes pop{50%{transform:scale(.8)}}
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:640px;background:var(--card);border-radius:16px 16px 0 0;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));animation:sheetin .18s ease-out}
@keyframes sheetin{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet .sb{display:block;width:100%;background:transparent;color:var(--text);text-align:right;padding:13px 14px;border-radius:10px;font-size:16px}
.sheet .sb:active{background:var(--line)}
.sheet .sb.dg{color:var(--new)}
/* فهرست چت */
.clist{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.clist .meta{margin:0;padding:8px 14px;background:var(--bg)}
.clist .empty{padding:16px 0}
.crow2{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.crow2:last-child{border-bottom:0}
.crow2:active{background:var(--bg)}
.crow2 .ci{flex:1;min-width:0}
.crt,.crb{display:flex;align-items:center;gap:8px}
.crt .cn{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crt .ctm{font-size:12px;color:var(--muted);flex-shrink:0}
.crb .prev{flex:1;min-width:0;margin-top:0}
.cn.ub,.prev.ub{color:var(--text);font-weight:700}
.udot{width:10px;height:10px;border-radius:50%;background:var(--accent);flex-shrink:0}
/* ===== نسخه ۱۶: ظاهر جدید + انیمیشن ===== */
:root{--bg:#eef7ff;--card:rgba(255,255,255,.74);--text:#12304a;--muted:#6a8399;--line:rgba(56,150,230,.18);--accent:#2a8ae8;--accent2:#38c0ff;--onaccent:#fff;--new:#f0457a;--chatbg:#eef7ff;--bin:rgba(255,255,255,.92);--btext:#12304a;--tick:#fff;--grad:linear-gradient(135deg,#2f86f0 0%,#38aaf8 55%,#5cc8ff 100%);--shadow:0 6px 24px rgba(40,120,200,.10);--shadowh:0 14px 36px rgba(40,120,200,.22);--glow:rgba(42,138,232,.30);--ease:cubic-bezier(.22,1,.36,1);--b1:rgba(56,160,255,.26);--b2:rgba(110,220,255,.24);--b3:rgba(130,170,255,.20)}
html{background:var(--bg)}
body,body.chatbody{background:transparent;font-family:Vazirmatn,Tahoma,"Segoe UI",sans-serif;position:relative}
body::before{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;background:radial-gradient(40% 35% at 20% 15%,var(--b1),transparent 70%),radial-gradient(35% 30% at 85% 25%,var(--b2),transparent 70%),radial-gradient(40% 35% at 60% 90%,var(--b3),transparent 70%);animation:drift 22s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate3d(4%,3%,0) rotate(6deg) scale(1.08)}}
h1{font-size:21px;font-weight:800;background:var(--grad);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:shine 5s ease-in-out infinite alternate}
@keyframes shine{to{background-position:100% 0}}
#app:has(input[type=password]){min-height:80vh;display:flex;flex-direction:column;justify-content:center}
#app:has(input[type=password]) h1{font-size:28px;text-align:center;margin-bottom:14px}

/* کارت‌ها */
.card,.clist{background:var(--card);-webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.card{transition:transform .35s var(--ease),box-shadow .35s var(--ease),border-color .25s}
.case{position:relative;overflow:hidden}
.case::before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:4px;background:var(--grad);transform:scaleY(0);transition:transform .35s var(--ease)}
@media (hover:hover){.case:hover{transform:translateY(-3px);box-shadow:var(--shadowh);border-color:var(--accent)}.case:hover::before{transform:scaleY(1)}.crow2:hover{background:var(--line)}.thumbs img:hover{transform:scale(1.06)}button.ghost:hover{color:var(--accent2)}}
.case:active{transform:scale(.985)}
.thumbs img{transition:transform .3s var(--ease);border-radius:10px}

/* دکمه‌ها */
button{background:var(--grad);background-size:140% 140%;color:#fff;border-radius:14px;font-weight:600;padding:11px 18px;box-shadow:0 6px 18px var(--glow);transition:transform .25s var(--ease),box-shadow .25s,background-position .5s,opacity .2s}
button:not(.x){position:relative;overflow:hidden}
button.ghost,button.del,.ibtn,.sb,.x,.bd,.x2{box-shadow:none}
button.ghost{background:transparent;color:var(--accent)}
@media (hover:hover){button:not(.ghost,.del,.ibtn,.sb,.x,.bd,.x2):hover{transform:translateY(-2px);box-shadow:0 10px 26px var(--glow);background-position:100% 50%}}
button:not(.ghost,.del,.ibtn,.sb,.x,.bd,.x2):active{transform:scale(.96)}
.rpl{position:absolute;border-radius:50%;background:currentColor;opacity:.28;transform:scale(0);animation:rpl .6s ease-out forwards;pointer-events:none}
@keyframes rpl{to{transform:scale(1);opacity:0}}

/* فیلدها */
input,textarea,select{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 14px;transition:border-color .25s,box-shadow .25s}
input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}
.cbox{border-radius:26px;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);transition:border-color .25s,box-shadow .25s}
.cbox:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}
.cbox textarea:focus{box-shadow:none}

/* نشان‌ها */
.badge{background:linear-gradient(135deg,#f0457a,#ff8a5c);animation:badgep 2s infinite}
@keyframes badgep{0%{box-shadow:0 0 0 0 rgba(240,69,122,.55)}70%{box-shadow:0 0 0 8px rgba(240,69,122,0)}100%{box-shadow:0 0 0 0 rgba(240,69,122,0)}}
.udot{background:var(--grad);animation:dotp 2s infinite}
@keyframes dotp{0%{box-shadow:0 0 0 0 var(--glow)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.empty{animation:breathe 2s ease-in-out infinite}
@keyframes breathe{50%{opacity:.5}}

/* ورود صفحه‌ها (با فلگ data-enter که اسکریپت می‌گذارد) */
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
#app[data-enter]>*{animation:up .55s var(--ease) both}
#app[data-enter]>:nth-child(2){animation-delay:.05s}#app[data-enter]>:nth-child(3){animation-delay:.1s}#app[data-enter]>:nth-child(4){animation-delay:.15s}#app[data-enter]>:nth-child(5){animation-delay:.2s}#app[data-enter]>:nth-child(6){animation-delay:.25s}#app[data-enter]>:nth-child(7){animation-delay:.3s}#app[data-enter]>:nth-child(n+8){animation-delay:.35s}
#app[data-enter]>#cases,#app[data-enter]>#notes,#app[data-enter]>.msgs{animation:none}
#app[data-enter] #cases .card,#app[data-enter] #notes .card{animation:up .5s var(--ease) both;animation-delay:.15s}
#app[data-enter] #cases .card:nth-child(2),#app[data-enter] #notes .card:nth-child(2){animation-delay:.2s}
#app[data-enter] #cases .card:nth-child(3),#app[data-enter] #notes .card:nth-child(3){animation-delay:.25s}
#app[data-enter] #cases .card:nth-child(4),#app[data-enter] #notes .card:nth-child(4){animation-delay:.3s}
#app[data-enter] #cases .card:nth-child(5),#app[data-enter] #notes .card:nth-child(5){animation-delay:.35s}
#app[data-enter] #cases .card:nth-child(n+6),#app[data-enter] #notes .card:nth-child(n+6){animation-delay:.4s}
#app[data-enter] .crow2{animation:up .45s var(--ease) both}
#app[data-enter] .crow2:nth-child(3){animation-delay:.06s}#app[data-enter] .crow2:nth-child(4){animation-delay:.12s}#app[data-enter] .crow2:nth-child(5){animation-delay:.18s}#app[data-enter] .crow2:nth-child(n+6){animation-delay:.24s}
#app[data-enter] .msgs>.bub:nth-last-child(-n+8){animation:bubin .45s var(--ease) both}

/* چت */
.chead{-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.bub{border-radius:18px;box-shadow:0 2px 8px rgba(30,90,160,.08)}
.bub.mine{background:var(--grad);color:#fff;box-shadow:0 4px 14px var(--glow)}
.bub.mine .who{color:rgba(255,255,255,.9)}
.bub.new{animation-duration:.45s;animation-timing-function:var(--ease)}
@keyframes bubin{from{opacity:0;transform:translateY(20px) scale(.88)}to{opacity:1;transform:none}}
.dsep span{-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.clist{overflow:hidden}
.clist .meta{background:transparent}
.crow2{transition:background .2s}
.av{background:var(--grad);border:2px solid var(--card);box-shadow:0 0 0 2px var(--accent)}
.sendb.on{background:var(--grad);color:#fff;box-shadow:0 4px 12px var(--glow)}
.sendb.on:not(.pop){animation:sendin .35s var(--ease)}
@keyframes sendin{from{transform:scale(.7) rotate(-20deg)}to{transform:none}}

/* توست، لایت‌باکس، شیت */
.toast{background:var(--grad);color:#fff;border-radius:16px;box-shadow:0 12px 32px var(--glow);font-weight:500;text-align:center;animation:toast 3.5s var(--ease) both}
@keyframes toast{0%{opacity:0;transform:translateY(24px) scale(.96)}8%,92%{opacity:1;transform:none}100%{opacity:0;transform:translateY(16px) scale(.97)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.lb{animation:fade .25s;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.lb img{animation:zoom .4s var(--ease)}
@keyframes zoom{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:none}}
.sheetbg{animation:fade .2s;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.sheet{background:var(--bin);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-radius:24px 24px 0 0;animation:sheetin .38s var(--ease)}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}button.ghost.back{color:var(--text);font-weight:600}
button.star{color:#f5b301;font-size:22px;line-height:1;padding:0 4px}
button.star.off{color:var(--muted);opacity:.45}
.swl{position:absolute;top:0;bottom:0;width:130px;display:flex;align-items:center;direction:ltr;font-weight:700;font-size:15px;pointer-events:none;opacity:0;border-radius:14px;transition:background .15s,font-size .15s}
.swl.r{right:100%;justify-content:flex-end;padding-right:18px;color:var(--accent);background:rgba(42,138,232,.14)}
.swl.l{left:100%;justify-content:flex-start;padding-left:18px;color:var(--new);background:rgba(240,69,122,.14)}
.swl.r.go{background:rgba(42,138,232,.3);font-size:17px}
.swl.l.go{background:rgba(240,69,122,.3);font-size:17px}
/* v17 */
html,body{overflow-x:hidden;overscroll-behavior-x:none}
body::before,h1,.badge,.udot,.empty{animation:none!important}
.card,.clist,.cbox{-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
.case.done{background:rgba(140,148,160,.22)!important}
.case.done .num{opacity:.75}
.vanish{animation:vanish .45s cubic-bezier(.4,0,.2,1) forwards;pointer-events:none}
@keyframes vanish{0%{box-shadow:0 0 0 0 rgba(120,200,255,0)}35%{box-shadow:0 0 28px 6px rgba(120,200,255,.8);filter:brightness(1.35) saturate(1.3)}100%{opacity:0;transform:scale(.92);filter:blur(10px) brightness(1.8);box-shadow:0 0 44px 14px rgba(160,225,255,0)}}
.copied{animation:cpop .5s ease}
@keyframes cpop{40%{transform:scale(1.35);text-shadow:0 0 12px var(--accent)}}
button.rec{background:var(--new)!important;color:#fff!important;animation:recp 1.2s infinite!important}
@keyframes recp{50%{box-shadow:0 0 0 8px rgba(240,69,122,.2)}}
.bell.on{text-shadow:0 0 10px var(--accent)}
.drow{display:flex;align-items:center;gap:10px;padding:6px 4px}.drow span{flex:1}
.sheet.dr{max-height:80vh;overflow:auto;padding:14px}
#app[data-enter] #cases .card,#app[data-enter] #notes .card{animation:none!important}
#app[data-enter]>*{animation-duration:.22s!important;animation-delay:0s!important}
body::before{will-change:transform}
button,.card{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.pbr{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px solid var(--line)}
.pbr a{color:var(--accent);text-decoration:none}.pbr .nm{flex:1;font-weight:600}.pbr .ph{direction:ltr}
.card.copied{animation:cardflash .55s ease}
@keyframes cardflash{40%{box-shadow:0 0 0 2px var(--accent),0 0 24px var(--accent)}}
.note{-webkit-touch-callout:none}
.bs{display:flex;flex-direction:column;align-items:center;flex-shrink:0}
.bs button{padding:2px 4px;line-height:1.3}
.nbadge{display:inline-block;margin-inline-start:6px;padding:1px 9px;border-radius:999px;background:rgba(10,132,255,.14);color:#0a84ff;font-size:11px;font-weight:700}
.pres{font-size:12px;color:var(--muted);white-space:nowrap}
.pres.onl,.chead .cs.pres.onl{color:#16a34a;font-weight:700}
.pres.onl::before{content:'● '}
.ondot{position:relative}
.ondot::after{content:'';position:absolute;bottom:1px;right:1px;width:12px;height:12px;border-radius:50%;background:#22c55e;border:2px solid #fff;box-sizing:border-box}
.bs{gap:16px;margin-top:6px}
.bs button.ib{width:44px;height:44px;padding:0;display:flex;align-items:center;justify-content:center;color:#000;opacity:1;line-height:1}
.bs button.ib svg{width:30px;height:30px;display:block;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.bs button.ib.on svg{fill:currentColor}
.bs button.star.on{color:#f5b301}
.bs button.bell.on{color:#e5252a;text-shadow:none}
.bl{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.bl.me{cursor:pointer}
.bl .t{flex:1;min-width:0;word-break:break-word}
.bl small{display:block;color:var(--muted);margin-top:3px}
.bl b{white-space:nowrap}
.bh{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:700;padding-bottom:6px}
.bgt{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:17px}
.bhint{color:var(--muted);font-size:12px;margin-top:6px}

/* ===== v21: Liquid Glass (سبک iOS) ===== */
.glrow{gap:8px;flex-wrap:wrap;align-items:stretch}
button.gl,.glbar{position:relative;overflow:hidden;isolation:isolate;color:#0e2f4f;border:0;
 background:
  linear-gradient(135deg,rgba(255,255,255,.40) 0%,rgba(255,255,255,.08) 46%,rgba(255,255,255,.24) 100%),
  rgba(88,128,168,.13);
 background-size:100% 100%;background-position:0 0;
 box-shadow:
  inset 0 1px 0 rgba(255,255,255,.7),
  inset 0 -1px 0 rgba(255,255,255,.24),
  inset 0 0 16px rgba(255,255,255,.22),
  0 12px 26px -10px rgba(18,48,88,.36),
  0 2px 6px rgba(18,48,88,.10);
 text-shadow:0 1px 0 rgba(255,255,255,.55)}
/* لبه‌ی نازک نورانی؛ در گوشه‌های بالا-چپ و پایین-راست پررنگ‌تر */
button.gl::before,.glbar::before{content:"";position:absolute;z-index:-1;inset:0;border-radius:inherit;padding:1.5px;pointer-events:none;
 background:linear-gradient(135deg,rgba(255,255,255,1) 0%,rgba(255,255,255,.30) 24%,rgba(255,255,255,.10) 50%,rgba(255,255,255,.32) 76%,rgba(255,255,255,.96) 100%);
 -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
 mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude}
/* بازتاب نرم سطح شیشه */
button.gl::after,.glbar::after{content:"";position:absolute;z-index:-1;inset:0;border-radius:inherit;pointer-events:none;
 background:radial-gradient(120% 75% at 16% 0%,rgba(255,255,255,.36),rgba(255,255,255,0) 56%),radial-gradient(90% 60% at 88% 100%,rgba(255,255,255,.24),rgba(255,255,255,0) 62%)}
button.gl{flex:1 1 auto;min-width:0;white-space:nowrap;font-size:14px;font-weight:700;padding:0 18px;min-height:44px;border-radius:999px;
 transition:transform .32s var(--ease),box-shadow .32s var(--ease),filter .3s}
button.gl.glic{flex:0 0 46px;width:46px;height:46px;min-height:46px;padding:0;display:inline-flex;align-items:center;justify-content:center}
button.gl.glic .ico{display:inline-flex}
button.gl.glic svg{width:24px;height:24px}
button.gl:active{transform:translateY(1px) scale(.965);filter:brightness(.96) saturate(1.1);
 box-shadow:inset 0 2px 8px rgba(18,48,88,.24),inset 0 1px 0 rgba(255,255,255,.55),0 4px 10px -6px rgba(18,48,88,.38)}
@media (hover:hover){button.gl:hover{transform:translateY(-1px);background-position:0 0;filter:brightness(1.03);
 box-shadow:inset 0 1px 0 rgba(255,255,255,.8),inset 0 -1px 0 rgba(255,255,255,.28),inset 0 0 18px rgba(255,255,255,.26),0 16px 30px -10px rgba(18,48,88,.4),0 3px 8px rgba(18,48,88,.12)}}
button.gl .badge{position:relative}
/* دکمه‌ی اصلی: شیشه‌ی شفاف با رنگ آبی */

 }

}

  h('div',{class:'bgt'},[h('span',{text:'باقی‌مانده'}),h('span',{text:ct?money(Math.max(rest,0))+' تومان':'-'})]),
  h('div',{class:'meta',text:!ct?'قراردادی ثبت نشده است':settled?'✅ تسویه شد':'⏳ تسویه نشده'+(rest<0?'':'')})
 ]));
 if(ct&&!adm&&(ct.signed_on||ct.description)){
  box.appendChild(h('div',{class:'card'},[h('div',{class:'glbar glt',text:'مشخصات قرارداد'}),ct.signed_on?h('div',{class:'meta',text:'تاریخ: '+dfa(ct.signed_on)}):null,ct.description?h('p',{class:'note',text:ct.description}):null]));
 }
 if(adm){
  var am=h('input',{placeholder:'مبلغ قرارداد (تومان)',inputmode:'numeric'}),dt=h('input',{type:'date'}),ds=h('textarea',{placeholder:'توضیحات قرارداد'}),sv=h('button',{class:'gl pri',text:'ذخیره قرارداد'});
  if(ct){am.value=String(ct.amount||'');dt.value=ct.signed_on||'';ds.value=ct.description||''}
  sv.addEventListener('click',async function(){
   var a=num2(am.value);if(!(a>=0)||am.value.trim()===''){toast('مبلغ قرارداد را درست وارد کن');return}
   sv.disabled=true;
   var r=await sb.from('contracts').upsert({case_id:id,amount:a,signed_on:dt.value||null,description:ds.value.trim(),updated_at:new Date().toISOString()},{onConflict:'case_id'});
   if(r.error){toast('ذخیره نشد: '+r.error.message);sv.disabled=false;return}
   toast('قرارداد ذخیره شد');renderContract(id);
  });
  box.appendChild(h('div',{class:'card'},[h('div',{class:'glbar glt',text:'قرارداد'}),h('div',{class:'row'},[am]),h('div',{class:'row'},[dt]),h('div',{class:'row'},[ds]),h('div',{class:'row glrow'},[sv])]));
 }
 var pc=h('div',{class:'card'},[h('div',{class:'glbar glt',text:'پرداخت‌ها'})]);
 if(!pays.length)pc.appendChild(h('p',{class:'empty',text:'پرداختی ثبت نشده است'}));
 pays.forEach(function(p){
  var row=h('div',{class:'frow'},[h('span',{text:dfa(p.paid_on)+' — '+money(p.amount)+' تومان'+(p.note?' — '+p.note:'')})]);
  if(adm){var dl=h('button',{class:'ghost',text:'حذف'});dl.addEventListener('click',async function(){

   if(r.error){toast('حذف نشد');return}renderContract(id);
  });row.appendChild(dl)}
  pc.appendChild(row);
 });
 box.appendChild(pc);
 if(adm){
  var pa=h('input',{placeholder:'مبلغ پرداخت (تومان)',inputmode:'numeric'}),pd=h('input',{type:'date'}),pn=h('input',{placeholder:'توضیح (اختیاری)'}),pb=h('button',{class:'gl pri',text:'ثبت پرداخت'});
  pd.value=new Date().toISOString().slice(0,10);
  pb.addEventListener('click',async function(){
   var a=num2(pa.value);if(!(a>0)){toast('مبلغ پرداخت را درست وارد کن');return}
   pb.disabled=true;
   var r=await sb.from('contract_payments').insert({case_id:id,amount:a,paid_on:pd.value||null,note:pn.value.trim()});
   if(r.error){toast('ثبت نشد: '+r.error.message);pb.disabled=false;return}
   toast('پرداخت ثبت شد');renderContract(id);
  });
  box.appendChild(h('div',{class:'card'},[h('div',{class:'glbar glt',text:'پرداخت جدید'}),h('div',{class:'row'},[pa]),h('div',{class:'row'},[pd]),h('div',{class:'row'},[pn]),h('div',{class:'row glrow'},[pb])]));
 }
}

(function(){

 if(!b||b.disabled||b.matches('.ghost,.del,.x,.bd,.x2,.dk'))return;

 s.className='rpl';s.style.cssText='width:'+d+'px;height:'+d+'px;left:'+(e.clientX-r.left-d/2)+'px;top:'+(e.clientY-r.top-d/2)+'px';

<script>
window.noteIntro=function(){
if(document.getElementById('ni'))return;var intro=document.createElement('div');intro.id='ni';intro.innerHTML='<div class="nb"></div><canvas></canvas>';document.body.appendChild(intro);var cv=intro.querySelector('canvas'),ctx=cv.getContext('2d');
var FONT='"Helvetica Neue",-apple-system,"Segoe UI",Roboto,Arial,sans-serif';
var PH="هر یادداشت همیشه در دسترس",FW=0;
/* sample notes shown on the orbs page: [text, x, y, big] */
var ORB=[["پرونده ۱۲۴۰",.3,.3,0],["جلسه کمیته نما",.72,.2,0],["یادداشت‌ها",.5,.43,1],["پیگیری مجوز",.8,.56,0],["صورتجلسه ناظر",.22,.66,0],["تحویل نقشه برق",.62,.76,0]];
/* timeline (ms) */
var SPD=1.6,tD=3300,tN=4300,tS=7000,tE=9000,tB=12500;
var M=1100,P=[],W=0,H=0,CY=0,dpr=1;
var rx,ry,ra,t0=0,amp=3,out=0,running=0;
function sm(a,b,t){t=Math.max(0,Math.min(1,(t-a)/(b-a)));return t*t*(3-2*t)}
function sample(draw,w,h){var c=document.createElement('canvas');c.width=w;c.height=h;var g=c.getContext('2d');g.fillStyle='#000';g.textBaseline='middle';g.textAlign='center';
 draw(g,w/2,h/2);var d=g.getImageData(0,0,w,h).data,a=[];
 for(var y=0;y<h;y++)for(var x=0;x<w;x++)if(d[(y*w+x)*4+3]>110)a.push([x-w/2,y-h/2]);
 for(var i=a.length-1;i>0;i--){var j=Math.random()*(i+1)|0,t=a[i];a[i]=a[j];a[j]=t}return a}
function build(){W=innerWidth;H=innerHeight;CY=H*.45;cv.width=W*dpr;cv.height=H*dpr;ctx.font='300 19px '+FONT;FW=ctx.measureText(PH).width;
 var A=sample(function(g,x,y){g.font='300 19px '+FONT;g.fillText(PH,x,y)},400,120),
 B=sample(function(g,x,y){g.font='300 56px '+FONT;try{g.letterSpacing='.2px'}catch(e){}g.fillText('Note',x,y)},320,120);
 P=[];for(var i=0;i<M;i++){var a=A[i%A.length]||[0,0],b=B[i%B.length]||[0,0],yy=1-2*(i+.5)/M,rr=Math.sqrt(1-yy*yy),th=i*2.39996,j=i>=A.length?Math.random()-.5:0,k=i>=B.length?Math.random()-.5:0;
  P.push({t1x:a[0]+j,t1y:a[1]+j,nx:b[0]+k,ny:b[1]+k,wx:60+Math.random()*170,wy:(Math.random()-.75)*170,sw:Math.random()*2-1,an:Math.random()*6.283,
   d1:Math.max(0,Math.min(1,(a[0]+110)/220))*500+Math.random()*180,d2:Math.random()*500,d3:Math.random()*160,ph:Math.random()*6.28,sz:1+Math.random()*.7,o:i%ORB.length,
   sp:[Math.cos(th)*rr,yy,Math.sin(th)*rr,Math.random()]})}}
/* particle path, one function per stage */
function s1(p,t){var u=sm(tD+p.d1,tD+p.d1+1100,t),q=Math.sin(u*3.1416)*p.sw*18;rx=W/2+p.t1x+p.wx*u+q;ry=CY+p.t1y+p.wy*u-q*.6;ra=.9-.5*u}
function s2(p,t){s1(p,tN);var bx=rx,by=ry,ba=ra,u=sm(tN+p.d2,tN+p.d2+1200,t),fx=W/2+p.nx,fy=CY+p.ny,q=Math.sin(u*3.1416)*p.sw*26,j=.5*u*Math.sin(t/260+p.ph);
 rx=bx+(fx-bx)*u+q+j;ry=by+(fy-by)*u-q*.5+j*.7;ra=ba+(.95-ba)*u}
function sph(p,t){var s=p.sp,r=t/900,x1=s[0]*Math.cos(r)+s[2]*Math.sin(r),z1=-s[0]*Math.sin(r)+s[2]*Math.cos(r),ex=sm(tE,tE+1100,t),R=Math.min(W*.24,96),sc=R*(1+.05*Math.sin(s[1]*5+t/400))*(1+ex*(1+s[3]*2.4));
 rx=W/2+x1*sc;ry=H*.42+s[1]*sc;ra=(.35+.5*(z1+1)/2)*(1-ex)}
function s3(p,t){var u=sm(tS+p.d3,tS+p.d3+850,t),bx=W/2+p.nx,by=CY+p.ny;sph(p,t);var q=Math.sin(u*3.1416)*p.sw*30;rx=bx+(rx-bx)*u+q;ry=by+(ry-by)*u-q*.5;ra=.95+(ra-.95)*u}
function orbPos(o,t){return[ORB[o][1]*W+Math.sin(t/1300+o*2)*6,ORB[o][2]*H*.9+Math.cos(t/1100+o)*6]}
function burst(p,t){var o=orbPos(p.o,t),u=sm(tB+p.d3*.5,tB+p.d3*.5+1200,t),r=(20+Math.abs(p.sw)*170)*u;rx=o[0]+Math.cos(p.an)*r;ry=o[1]+Math.sin(p.an)*r;ra=(1-u)*.8}
function at(p,t){if(t<tN)s1(p,t);else if(t<tS)s2(p,t);else s3(p,t)}

function frame(now){
 if(!running)return;
 var t=(now-t0)*SPD;
 ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
 /* typed text + wave (same as the original intro) */
 if(t<tD){
  var n=Math.min(PH.length,Math.floor(Math.max(0,t-300)/70)),str=PH.slice(0,n),cut=str.lastIndexOf(' '),xr=W/2+FW/2;
  ctx.font='300 19px '+FONT;ctx.textBaseline='middle';ctx.textAlign='right';
  if(n<PH.length&&cut>=0){var pa=str.slice(0,cut+1);ctx.fillStyle='#1d2029';ctx.fillText(pa,xr,CY);ctx.fillStyle='#a3a7b2';ctx.fillText(str.slice(cut+1),xr-ctx.measureText(pa).width,CY)}
  else{ctx.fillStyle='#1d2029';ctx.fillText(str,xr,CY)}}
 var talking=t<3000&&t>300,wa=1-sm(3300,3900,t),y0=H*.76;
 amp+=((talking?16+14*Math.abs(Math.sin(t/130)*Math.sin(t/310+1)):3)-amp)*.15;
 if(wa>0){ctx.globalAlpha=wa;
  for(var Lr=0;Lr<3;Lr++){ctx.beginPath();
   for(var x=0;x<=W;x+=4){var q=x/W,env=Math.exp(-Math.pow((q-.5)*3.4,2)),yy=y0+Math.sin(q*9+t/(520+Lr*170)+Lr*2.1)*amp*env*(1-Lr*.22)*(Lr%2?-1:1);x?ctx.lineTo(x,yy):ctx.moveTo(x,yy)}
   ctx.strokeStyle='rgba(28,30,42,'+(.6-Lr*.14)+')';ctx.lineWidth=1;ctx.stroke()}
  ctx.beginPath();ctx.moveTo(0,y0);ctx.lineTo(W,y0);ctx.strokeStyle='rgba(28,30,42,.3)';ctx.stroke();ctx.globalAlpha=1}
 /* powder particles: text -> dust -> "Note" -> sphere -> burst */
 if(t>=tD){ctx.fillStyle='rgb(29,32,41)';
  for(var i=0;i<M;i++){var p=P[i];at(p,t);if(ra>.02){ctx.globalAlpha=ra;ctx.fillRect(rx,ry,p.sz,p.sz)}}ctx.globalAlpha=1}
 /* enter the app */
 if(t>tE+500&&!out){out=1;intro.classList.add('out')}
 if(t>tE+1800){running=0;removeEventListener('resize',build);intro.remove();return}
 requestAnimationFrame(frame)}
function start(){out=0;amp=3;running=1;t0=performance.now();requestAnimationFrame(frame)}
/* tap = jump to the next page of the intro */
intro.addEventListener('pointerdown',function(){var t=(performance.now()-t0)*SPD,B=[tD,tS,tE];for(var i=0;i<B.length;i++)if(B[i]>t+150){t0=performance.now()-B[i]/SPD;return}});
addEventListener('resize',build);
build();start();
};
</script>
