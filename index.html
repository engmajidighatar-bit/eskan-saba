<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>

<title>یادداشت پرونده‌ها</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1b1f24;--muted:#69727d;--line:#e2e5ea;--accent:#2563eb;--onaccent:#fff;--new:#dc2626}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Tahoma,"Segoe UI",sans-serif;font-size:16px;line-height:1.7;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:640px;margin:0 auto;padding:12px}
h1{font-size:20px;margin:8px 0}
input,textarea,button,select{font:inherit;color:inherit}
select{width:100%;padding:10px 6px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:inherit;font:inherit}
input,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
textarea{min-height:90px;resize:vertical}
button{border:0;border-radius:10px;padding:10px 16px;background:var(--accent);color:var(--onaccent);cursor:pointer}
button.ghost{background:transparent;color:var(--accent);padding:6px 0}
button.del{background:transparent;color:var(--new);padding:2px 0;font-size:13px}
.acts{display:flex;gap:14px;flex-shrink:0}

.foot .meta{margin-top:0}
.thumbs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.thumbs img{width:88px;height:88px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:pointer;background:var(--bg)}
.pv{position:relative}
.pv img{cursor:default}
.pv .x{position:absolute;top:2px;left:2px;width:22px;height:22px;padding:0;border-radius:99px;background:rgba(0,0,0,.65);color:#fff;font-size:15px;line-height:22px}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:20;display:flex;align-items:center;justify-content:center;padding:8px}
.lb img{max-width:100%;max-height:100%;object-fit:contain}
.frow{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:6px 10px;margin-top:6px;font-size:14px}
.frow .fn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr;text-align:right;flex:1}
.frow button{padding:2px 8px;font-size:13px}
.frow button.x2{background:transparent;color:var(--new)}
.export{position:fixed;inset:0;z-index:15;overflow:auto;background:#fff;color:#111;padding:14px;padding-top:calc(14px + env(safe-area-inset-top,0px))}
.export .meta{color:#555}
.export h2{margin:6px 0}
.export .en{border-top:1px solid #ccc;padding:10px 0;break-inside:avoid}
.export .en img{max-width:48%;max-height:9cm;object-fit:contain;margin:4px;border:1px solid #ccc;border-radius:6px}
.export .bar2{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
@media print{body>*:not(.export){display:none!important}.export{position:static!important;overflow:visible!important;padding:0}.noprint{display:none!important}}
.rep{background:#fff;color:#111;padding:24px;font-family:Tahoma,"Segoe UI",sans-serif;font-size:15px;line-height:1.8;direction:rtl}
.rep h2{margin:0 0 4px;font-size:22px}
.rep h3{margin:2px 0 6px;font-size:17px}
.rep .meta{color:#555;font-size:13px;margin-top:0}
.rep .en{border-top:1px solid #ccc;padding:10px 0}
.rep .en img{max-width:48%;max-height:9cm;object-fit:contain;margin:4px;border:1px solid #ccc;border-radius:6px}
button:disabled{opacity:.5}
.row{display:flex;gap:8px;margin:8px 0}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0}
.case{cursor:pointer}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.num{font-weight:700}
.meta{color:var(--muted);font-size:13px;margin-top:4px}
.badge{background:var(--new);color:#fff;border-radius:99px;font-size:12px;padding:1px 8px}
.prev{color:var(--muted);font-size:14px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note{white-space:pre-wrap;word-break:break-word;margin:0}
.empty{color:var(--muted);text-align:center;padding:24px 0}
.toast{position:fixed;inset:auto 12px calc(12px + env(safe-area-inset-bottom,0px)) 12px;max-width:616px;margin:0 auto;background:var(--accent);color:var(--onaccent);padding:10px 14px;border-radius:12px;z-index:9}
.av{border-radius:50%;object-fit:cover;background:var(--accent);color:var(--onaccent);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;border:1px solid var(--line)}
.chrow{display:flex;align-items:center;gap:10px}
.ci{flex:1;min-width:0}
.ci .prev{margin-top:0}
.msgs{display:flex;flex-direction:column;gap:8px;padding:8px 0;min-height:40vh}
.bub{max-width:82%;padding:8px 12px;border-radius:14px;background:var(--card);border:1px solid var(--line);align-self:flex-end;word-break:break-word}
.bub.mine{align-self:flex-start;background:var(--accent);color:var(--onaccent);border-color:var(--accent)}
.bub .who{font-size:12px;font-weight:700;margin-bottom:2px;color:var(--accent)}
.bub .tm{font-size:11px;opacity:.75;margin-top:2px;display:flex;gap:10px;justify-content:space-between;align-items:center}
.bub img.ph{max-width:100%;max-height:260px;border-radius:10px;display:block;margin:4px 0;cursor:pointer}
.bub a.fl{display:block;color:inherit;text-decoration:underline;direction:ltr;text-align:right;margin:4px 0;word-break:break-all}
.bub button.bd{background:transparent;color:inherit;padding:0;font-size:11px;opacity:.85}
.cmp{position:sticky;bottom:0;background:var(--bg);padding:8px 0;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}
.cmp textarea{min-height:44px;height:44px;flex:1}
.cmp .row{align-items:flex-end;margin:0}
.cmp .row button{flex-shrink:0}
.pbox{display:flex;flex-direction:column;align-items:center;gap:10px}
</style>
</head>

async function makePdf(build){
 if(!window.html2canvas)await loadScript('https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js');
 if(!window.jspdf)await loadScript('https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js');
 var host=h('div',{style:'position:fixed;left:0;top:0;width:794px;z-index:-1;background:#fff'});
 host.appendChild(build());document.body.appendChild(host);
 try{
  var imgs=Array.prototype.slice.call(host.querySelectorAll('img'));
  await Promise.all(imgs.map(function(i){return i.complete?1:new Promise(function(r){i.onload=r;i.onerror=r})}));
  var W=host.offsetWidth,H=host.offsetHeight;
  var sc=Math.max(0.7,Math.min(2,16000/H));
  var canvas=await window.html2canvas(host,{scale:sc,useCORS:true,backgroundColor:'#ffffff',logging:false});
  var top0=host.getBoundingClientRect().top;
  var tops=Array.prototype.slice.call(host.querySelectorAll('.blk')).map(function(b){return b.getBoundingClientRect().top-top0});
  var pdf=new window.jspdf.jsPDF({unit:'pt',format:'a4'});
  var pw=pdf.internal.pageSize.getWidth(),ph=pdf.internal.pageSize.getHeight(),mg=28;
  var usable=(ph-2*mg)/pw*W,k=canvas.width/W,y=0,first=true;
  while(y<H-1){
   var end=Math.min(H,y+usable);
   if(end<H){var cut=null;tops.forEach(function(t){if(t>y+usable*0.4&&t<=end)cut=t});if(cut!==null)end=cut}
   var sy=Math.round(y*k),sh=Math.round((end-y)*k);if(sh<=0)break;
   var tmp=document.createElement('canvas');tmp.width=canvas.width;tmp.height=sh;
   var cx=tmp.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,tmp.width,sh);
   cx.drawImage(canvas,0,sy,canvas.width,sh,0,0,canvas.width,sh);
   if(!first)pdf.addPage();first=false;
   pdf.addImage(tmp.toDataURL('image/jpeg',0.85),'JPEG',0,mg,pw,(end-y)/W*pw);
   y=end;
  }
  return pdf.output('blob');
 }finally{host.remove()}
}

var JM=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
function jParts(d){var o={};new Intl.DateTimeFormat('en-u-ca-persian-nu-latn',{year:'numeric',month:'numeric',day:'numeric'}).formatToParts(d).forEach(function(x){o[x.type]=x.value});return {y:+o.year,m:+o.month,d:+o.day}}
function jOrd(p){return p.y*372+(p.m-1)*31+p.d}
function jToG(jy,jm,jd){
 var off=(jm<=6?(jm-1)*31:186+(jm-7)*30)+jd-1;
 var t=new Date(jy+621,2,21+off,12,0,0),tg=jOrd({y:jy,m:jm,d:jd});
 for(var i=0;i<8;i++){var c=jOrd(jParts(t));if(c===tg)break;t=new Date(t.getFullYear(),t.getMonth(),t.getDate()+(tg>c?1:-1),12,0,0)}
 return t;
}
function jDim(jy,jm){if(jm<=6)return 31;if(jm<=11)return 30;var p=jParts(jToG(jy,12,30));return(p.m===12&&p.d===30)?30:29}
function fa(n){return n.toLocaleString('fa-IR',{useGrouping:false})}

 function fill(keep){
  var n=jDim(+ys.value,+ms.value);ds.textContent='';
  for(var d=1;d<=n;d++)ds.appendChild(h('option',{value:String(d),text:fa(d)}));
  ds.value=String(Math.min(keep,n));
 }
 ys.value=String(now.y);ms.value=String(now.m);fill(now.d);
 ms.addEventListener('change',function(){fill(+ds.value)});
 ys.addEventListener('change',function(){fill(+ds.value)});
 return {nodes:[ds,ms,ys],get:function(){

 }};

async function loadRooms(){

 chatRooms=(rr.data||[]).map(function(r){r.members=rooms[r.id]||[];return r});
 chatLast={};
 var ids=chatRooms.map(function(r){return r.id});
 if(ids.length){
  var lm=await sb.from('chat_messages').select('room_id,sender_id,body,file_name,created_at').in('room_id',ids).order('created_at',{ascending:false}).limit(300);

 renderRoom(id,title,other);
 await loadMsgs();
 if(chatRoom===id)drawMsgs();
}
function renderRoom(id,title,other){
 app.textContent='';
 app.appendChild(h('button',{class:'ghost',text:'→ بازگشت',onclick:function(){renderChatList()}}));
 var hv=other?avatar(other,32):h('span',{class:'av',style:'width:32px;height:32px;font-size:16px',text:'👥'});
 app.appendChild(h('div',{class:'chrow'},[hv,h('h1',{text:title})]));
 app.appendChild(h('div',{class:'msgs',id:'msgs'},[h('p',{class:'empty',text:'در حال بارگذاری…'})]));
 var ta=h('textarea',{placeholder:'پیام…',rows:'1'});
 var fi=h('input',{type:'file',multiple:'multiple',style:'display:none'});
 var att=h('button',{class:'ghost',text:'📎'});
 var send=h('button',{text:'ارسال'});
 var pv=h('div',{});
 function renderCpend(){
  pv.textContent='';
  cpend.forEach(function(f,i){
   var x=h('button',{class:'x2',text:'حذف'});
   x.addEventListener('click',function(){cpend.splice(i,1);renderCpend()});
   pv.appendChild(h('div',{class:'frow'},[h('span',{class:'fn',text:'📎 '+f.name+' ('+sz(f.size)+')'}),x]));
  });
 }
 att.addEventListener('click',function(){fi.click()});
 fi.addEventListener('change',function(){
  var fl=Array.prototype.slice.call(fi.files||[]);fi.value='';
  fl.forEach(function(f){
   if(cpend.length>=5){toast('حداکثر ۵ فایل در هر بار ارسال');return}
   if(f.size>10*1024*1024){toast('فایل «'+f.name+'» بزرگ‌تر از ۱۰ مگابایت است');return}
   cpend.push(f);
  });
  renderCpend();
 });
 send.addEventListener('click',async function(){
  var t=ta.value.trim();if(!t&&!cpend.length)return;
  send.disabled=true;att.disabled=true;
  try{
   if(!cpend.length){
    var r=await sb.from('chat_messages').insert({room_id:id,sender_id:me,body:t});
    if(r.error)throw r.error;
   }else{
    toast('در حال ارسال…');
    for(var i=0;i<cpend.length;i++){
     var f=cpend[i],blob=f,name=f.name,type=f.type||'application/octet-stream';
     if(type.indexOf('image/')===0&&type!=='image/gif'){blob=await shrink(f);type='image/jpeg'}
     var path=id+'/'+uid()+'.'+(type==='image/jpeg'?'jpg':ext(name));
     var up=await sb.storage.from(CB).upload(path,blob,{contentType:type});
     if(up.error)throw up.error;
     var pu=sb.storage.from(CB).getPublicUrl(path).data.publicUrl;
     var r2=await sb.from('chat_messages').insert({room_id:id,sender_id:me,body:(i===0&&t)?t:null,file_url:pu,file_name:name,file_type:type});
     if(r2.error)throw r2.error;
    }
   }
   ta.value='';cpend=[];renderCpend();
   await loadMsgs();drawMsgs();
  }catch(e){toast('ارسال انجام نشد: '+((e&&e.message)||''))}
  send.disabled=false;att.disabled=false;
 });
 app.appendChild(h('div',{class:'cmp'},[pv,h('div',{class:'row'},[att,ta,send,fi])]));
}
function drawMsgs(){
 var box=document.getElementById('msgs');if(!box)return;box.textContent='';
 if(!chatMsgs.length){box.appendChild(h('p',{class:'empty',text:'هنوز پیامی نیست؛ اولین پیام را بفرست'}));return}
 chatMsgs.forEach(function(m){
  var mine=m.sender_id===me;
  var b=h('div',{class:'bub'+(mine?' mine':'')});
  if(chatKind==='group'&&!mine)b.appendChild(h('div',{class:'who',text:cname(m.sender_id)}));
  if(m.body)b.appendChild(h('div',{class:'note',text:m.body}));
  var u=safeUrl(m.file_url);
  if(u){
   if((m.file_type||'').indexOf('image/')===0){
    var im=h('img',{class:'ph',src:u,loading:'lazy'});
    im.addEventListener('click',function(){showImg(u)});
    b.appendChild(im);
   }else{
    b.appendChild(h('a',{class:'fl',href:u+'?download='+encodeURIComponent(m.file_name||'file'),target:'_blank',rel:'noopener',text:'📎 '+(m.file_name||'فایل')}));
   }
  }
  var tm=h('div',{class:'tm'},[h('span',{text:fmt(m.created_at)})]);
  if(mine){
   var d=h('button',{class:'bd',text:'حذف'});
   d.addEventListener('click',async function(){
    if(!confirm('این پیام حذف شود؟'))return;
    var r=await sb.from('chat_messages').delete().eq('id',m.id).select();
    if(r.error||!r.data||!r.data.length){toast('حذف انجام نشد');return}
    await loadMsgs();drawMsgs();
   });
   tm.appendChild(d);
  }
  b.appendChild(tm);box.appendChild(b);
 });
 cseenSet(chatRoom,Date.now());
 window.scrollTo(0,document.body.scrollHeight);
}
function renderChatProfile(){
 app.textContent='';
 app.appendChild(h('button',{class:'ghost',text:'→ بازگشت',onclick:function(){renderChatList()}}));
 app.appendChild(h('h1',{text:'پروفایل من در چت'}));
 var cur=cprof[me]||{};
 var newBlob=null,prevUrl=null;
 var avBox=h('div',{});
 function drawAv(){
  avBox.textContent='';
  if(prevUrl)avBox.appendChild(h('img',{class:'av',style:'width:96px;height:96px',src:prevUrl}));
  else avBox.appendChild(avatar(me,96));
 }
 drawAv();
 var nameIn=h('input',{placeholder:'نام نمایشی',value:cur.full_name||names[me]||''});
 var fi=h('input',{type:'file',accept:'image/*',style:'display:none'});
 var pick=h('button',{class:'ghost',text:'📷 انتخاب عکس پروفایل'});
 var save=h('button',{text:'ذخیره'});
 pick.addEventListener('click',function(){fi.click()});
 fi.addEventListener('change',async function(){
  var f=fi.files&&fi.files[0];fi.value='';if(!f)return;
  try{newBlob=await shrink(f,400);if(prevUrl)URL.revokeObjectURL(prevUrl);prevUrl=URL.createObjectURL(newBlob);drawAv()}catch(e){toast('عکس خوانده نشد')}
 });
 save.addEventListener('click',async function(){
  var n=nameIn.value.trim();if(!n){toast('نام نمایشی را وارد کن');return}
  save.disabled=true;
  try{
   var url=cur.avatar_url||null;
   if(newBlob){
    var path='avatars/'+me+'/'+uid()+'.jpg';
    var up=await sb.storage.from(CB).upload(path,newBlob,{contentType:'image/jpeg'});
    if(up.error)throw up.error;
    url=sb.storage.from(CB).getPublicUrl(path).data.publicUrl;
   }
   var r=await sb.from('chat_profiles').upsert({id:me,full_name:n,avatar_url:url},{onConflict:'id'});
   if(r.error)throw r.error;
   await loadChatProfiles();toast('پروفایل ذخیره شد');renderChatList();
  }catch(e){toast('ذخیره انجام نشد: '+((e&&e.message)||''));save.disabled=false}
 });
 app.appendChild(h('div',{class:'card'},[h('div',{class:'pbox'},[avBox,pick,fi]),h('div',{class:'row'},[nameIn]),h('div',{class:'row'},[save])]));
}
async function onChatMsg(p){
 var m=p.new;if(!m)return;
 if(chatRoom===m.room_id){await loadMsgs();drawMsgs();return}
 if(m.sender_id===me)return;
 if(!cprof[m.sender_id])await loadChatProfiles();
 toast(cname(m.sender_id)+' در چت پیام فرستاد');
 if(document.getElementById('chatlist')){await loadRooms();drawChatList()}else refreshChatBadge();
}
/* ============== پایان بخش چت ============== */

async function onNote(p){
 var n=p.new;if(!n)return;
 await loadProfiles();
 if(openId===n.case_id){await loadNotes();renderNotes();seenSet(openId,Date.now());return}
 await refreshCases();
 if(n.author_id!==me){var c=cases.filter(function(x){return x.id===n.case_id})[0];
  toast(nm(n.author_id)+' در پرونده '+(c?c.number:'')+' یادداشت گذاشت')}
}

function b64(s){var p='='.repeat((4-s.length%4)%4),b=(s+p).replace(/-/g,'+').replace(/_/g,'/'),r=atob(b),o=new Uint8Array(r.length);for(var i=0;i<r.length;i++)o[i]=r.charCodeAt(i);return o}
async function enablePush(){
 try{
  if(!('serviceWorker' in navigator)||!('PushManager' in window)){toast('اعلان روی این مرورگر پشتیبانی نمی‌شود');return}
  var perm=await Notification.requestPermission();
  if(perm!=='granted'){toast('اجازه‌ی اعلان داده نشد');return}
  var reg=await navigator.serviceWorker.ready;
  var sub=await reg.pushManager.getSubscription()||await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64(VAPID_PUBLIC_KEY)});
  var j=sub.toJSON();
  var r=await sb.from('push_subscriptions').upsert({endpoint:j.endpoint,subscription:j,user_id:me},{onConflict:'endpoint'});
  toast(r.error?'ثبت اعلان انجام نشد':'اعلان فعال شد');
 }catch(e){toast('فعال‌سازی اعلان انجام نشد')}
}

async function boot(){
 if('serviceWorker' in navigator){try{navigator.serviceWorker.register('sw.js')}catch(e){}}
 var s=await sb.auth.getSession();
 if(!s.data.session){renderLogin();return}
 me=s.data.session.user.id;
 await loadProfiles();await loadCases();renderList();
 sb.channel('app')
  .on('postgres_changes',{event:'*',schema:'public',table:'cases'},function(){clearTimeout(tmr);tmr=setTimeout(refreshCases,200)})
  .on('postgres_changes',{event:'INSERT',schema:'public',table:'notes'},onNote)
  .on('postgres_changes',{event:'UPDATE',schema:'public',table:'notes'},async function(){if(openId){await loadNotes();renderNotes()}await refreshCases()})
  .on('postgres_changes',{event:'DELETE',schema:'public',table:'notes'},async function(){if(openId){await loadNotes();renderNotes()}await refreshCases()})
  .on('postgres_changes',{event:'INSERT',schema:'public',table:'chat_messages'},onChatMsg)
  .on('postgres_changes',{event:'DELETE',schema:'public',table:'chat_messages'},async function(){if(chatRoom){await loadMsgs();drawMsgs()}})
  .subscribe();
}
boot();
})();
</script>
