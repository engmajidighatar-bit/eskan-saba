<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>یادداشت پرونده‌ها</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1b1f24;--muted:#69727d;--line:#e2e5ea;--accent:#2563eb;--onaccent:#fff;--new:#dc2626}
@media (prefers-color-scheme:dark){:root{--bg:#14171b;--card:#1d2127;--text:#eceff3;--muted:#98a2ae;--line:#2c323a;--accent:#60a5fa;--onaccent:#0b1220;--new:#f87171}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Tahoma,"Segoe UI",sans-serif;font-size:16px;line-height:1.7;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:640px;margin:0 auto;padding:12px}
h1{font-size:20px;margin:8px 0}
input,textarea,button{font:inherit;color:inherit}
input,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
textarea{min-height:90px;resize:vertical}
button{border:0;border-radius:10px;padding:10px 16px;background:var(--accent);color:var(--onaccent);cursor:pointer}
button.ghost{background:transparent;color:var(--accent);padding:6px 0}
button.del{background:transparent;color:var(--new);padding:2px 0;font-size:13px}
.acts{display:flex;gap:14px;flex-shrink:0}
.acts button{padding:2px 0;font-size:13px}
.foot .meta{margin-top:0}
.thumbs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.thumbs img{width:88px;height:88px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:pointer;background:var(--bg)}
.pv{position:relative}
.pv img{cursor:default}
.pv .x{position:absolute;top:2px;left:2px;width:22px;height:22px;padding:0;border-radius:99px;background:rgba(0,0,0,.65);color:#fff;font-size:15px;line-height:22px}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:20;display:flex;align-items:center;justify-content:center;padding:8px}
.lb img{max-width:100%;max-height:100%;object-fit:contain}
button:disabled{opacity:.5}
.row{display:flex;gap:8px;margin:8px 0}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0}
.case{cursor:pointer}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.num{font-weight:700}
.meta{color:var(--muted);font-size:13px;margin-top:4px}
.badge{background:var(--new);color:#fff;border-radius:99px;font-size:12px;padding:1px 8px}
.prev{color:var(--muted);font-size:14px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note{white-space:pre-wrap;word-break:break-word;margin:0}
.empty{color:var(--muted);text-align:center;padding:24px 0}
.toast{position:fixed;inset:auto 12px calc(12px + env(safe-area-inset-bottom,0px)) 12px;max-width:616px;margin:0 auto;background:var(--accent);color:var(--onaccent);padding:10px 14px;border-radius:12px;z-index:9}
</style>
</head>
<body>
<div class="wrap" id="app"><p class="empty">در حال بارگذاری…</p></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function(){
var SB_URL='https://wrxjritynrcqaeaolcvy.supabase.co';
var SB_KEY='sb_publishable_c0bnp4eGZmQAc4LkEl30Hw_VY5grlnC';
var VAPID_PUBLIC_KEY='BEgIr2zXmI1fmKVmz7xhO4IjAekdCjkZo8_PLckHT77SFRWdLATFYyPLFSb7BWXLRxONIToJ_gp1XaoNUF1LxNY';

var sb=supabase.createClient(SB_URL,SB_KEY);
var app=document.getElementById('app');
var me=null,names={},cases=[],notes=[],openId=null,query='',tmr=null,pending=[],urls={};
var BUCKET='note-images';

function h(tag,attrs,kids){var e=document.createElement(tag);
 for(var k in (attrs||{})){if(k==='text')e.textContent=attrs[k];else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),attrs[k]);else e.setAttribute(k,attrs[k]);}
 (kids||[]).forEach(function(c){if(c)e.appendChild(c)});return e;}
function fmt(ts){try{return new Date(ts).toLocaleString('fa-IR',{dateStyle:'medium',timeStyle:'short'})}catch(e){return ''}}
function seenGet(id){try{return Number(localStorage.getItem('seen:'+id))||0}catch(e){return 0}}
function seenSet(id,t){try{localStorage.setItem('seen:'+id,String(t))}catch(e){}}
function nm(id){return names[id]||'همکار'}
function toast(t){var x=h('div',{class:'toast',text:t});document.body.appendChild(x);setTimeout(function(){x.remove()},3500)}

async function loadProfiles(){var r=await sb.from('profiles').select('id,name');if(r.data)r.data.forEach(function(p){names[p.id]=p.name||''})}
async function loadCases(){var r=await sb.from('cases').select('*').order('last_at',{ascending:false});if(r.data)cases=r.data}
async function loadNotes(){var r=await sb.from('notes').select('*').eq('case_id',openId).order('created_at',{ascending:false});if(r.data)notes=r.data;await signImages()}
async function signImages(){
 var ps=[];notes.forEach(function(n){(n.images||[]).forEach(function(x){ps.push(x)})});urls={};if(!ps.length)return;
 try{var q=await sb.storage.from(BUCKET).createSignedUrls(ps,3600);if(q.data)q.data.forEach(function(x){if(x.signedUrl)urls[x.path]=x.signedUrl})}catch(e){}
}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,10)}
function shrink(file){return new Promise(function(res,rej){
 var img=new Image(),u=URL.createObjectURL(file);
 img.onload=function(){var m=1600,w=img.naturalWidth,hh=img.naturalHeight,k=Math.min(1,m/Math.max(w,hh));
  var c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(hh*k);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);
  c.toBlob(function(b){b?res(b):rej(new Error('x'))},'image/jpeg',0.82)};
 img.onerror=function(){URL.revokeObjectURL(u);rej(new Error('bad'))};
 img.src=u})}
function showImg(src){var o=h('div',{class:'lb'},[h('img',{src:src})]);o.addEventListener('click',function(){o.remove()});document.body.appendChild(o)}
async function dropFiles(paths){if(!paths||!paths.length)return;try{await sb.storage.from(BUCKET).remove(paths)}catch(e){}}
async function refreshCases(){await loadCases();if(!openId)renderCases()}

function renderLogin(){
 app.textContent='';
 var em=h('input',{type:'email',placeholder:'ایمیل',autocomplete:'username'});
 var pw=h('input',{type:'password',placeholder:'رمز عبور',autocomplete:'current-password'});
 var nameIn=h('input',{placeholder:'نام و نام خانوادگی',autocomplete:'name'});
 var b=h('button',{text:'ورود'});
 b.addEventListener('click',async function(){
  b.disabled=true;
  var r=await sb.auth.signInWithPassword({email:em.value.trim(),password:pw.value});
  if(r.error){var m=r.error.message||'';toast(/not confirmed/i.test(m)?'ایمیل این کاربر هنوز تأیید نشده است (در Supabase تیک Auto Confirm لازم است)':/invalid login/i.test(m)?'ایمیل یا رمز عبور درست نیست':'خطا: '+m);b.disabled=false;return}
  var uid=r.data.user.id;
  var full=nameIn.value.trim();
  if(!full){
   var q=await sb.from('profiles').select('name').eq('id',uid).maybeSingle();
   var old=(q.data&&q.data.name)?q.data.name.trim():'';
   if(old){location.reload();return}
   full=(prompt('نام و نام خانوادگی خود را وارد کنید')||'').trim();
   if(!full){toast('وارد کردن نام و نام خانوادگی لازم است');await sb.auth.signOut();b.disabled=false;return}
  }
  var u=await sb.from('profiles').upsert({id:uid,name:full},{onConflict:'id'});
  if(u.error){toast('ذخیره‌ی نام انجام نشد: '+u.error.message);setTimeout(function(){location.reload()},3500);return}
  location.reload();
 });
 app.appendChild(h('h1',{text:'ورود به یادداشت پرونده‌ها'}));
 var eye=h('button',{class:'ghost',text:'نمایش رمز'});
 eye.addEventListener('click',function(){pw.type=pw.type==='password'?'text':'password'});
 app.appendChild(h('div',{class:'card'},[nameIn,h('div',{class:'row'},[em]),h('div',{class:'row'},[pw]),eye,h('div',{class:'row'},[b])]));
}

async function editCase(c){
 var n=prompt('شماره پرونده',c.number);if(n===null)return;n=n.trim();if(!n)return;
 var t=prompt('عنوان پرونده (اختیاری)',c.title||'');if(t===null)return;
 var r=await sb.from('cases').update({number:n,title:t.trim()}).eq('id',c.id).select();
 if(r.error||!r.data||!r.data.length){toast(r.error&&r.error.code==='23505'?'این شماره پرونده قبلاً ثبت شده است':'ویرایش پرونده انجام نشد'+(r.error?': '+r.error.message:''));return}
 await loadCases();if(openId){renderCase();renderNotes()}else renderCases();toast('پرونده ویرایش شد');
}
async function delCase(c){
 if(!confirm('پرونده '+c.number+' با همه‌ی یادداشت‌هایش حذف شود؟'))return;
 var im=await sb.from('notes').select('images').eq('case_id',c.id);
 var all=[];(im.data||[]).forEach(function(x){(x.images||[]).forEach(function(p){all.push(p)})});
 var r=await sb.from('cases').delete().eq('id',c.id).select();
 if(r.error||!r.data||!r.data.length){toast('حذف پرونده انجام نشد'+(r.error?': '+r.error.message:''));return}
 await dropFiles(all);await loadCases();renderList();toast('پرونده حذف شد');
}
function caseActs(c){
 var e=h('button',{class:'ghost',text:'ویرایش'});
 var d=h('button',{class:'del',text:'حذف'});
 e.addEventListener('click',function(ev){ev.stopPropagation();editCase(c)});
 d.addEventListener('click',function(ev){ev.stopPropagation();delCase(c)});
 return h('div',{class:'acts'},[e,d]);
}

function renderList(){
 openId=null;app.textContent='';
 var out=h('button',{class:'ghost',text:'خروج'});
 out.addEventListener('click',async function(){
  try{await sb.auth.signOut({scope:'local'})}catch(e){}
  try{Object.keys(localStorage).forEach(function(k){if(k.indexOf('sb-')===0)localStorage.removeItem(k)})}catch(e){}
  location.reload();
 });
 var bar=[h('h1',{text:'پرونده‌ها'}),out];
 var bell=null;
 if(VAPID_PUBLIC_KEY){bell=h('button',{class:'ghost',text:'فعال‌سازی اعلان'});bell.addEventListener('click',enablePush)}
 app.appendChild(h('div',{class:'bar'},bar));
 if(bell)app.appendChild(bell);
 var q=h('input',{type:'search',placeholder:'جست‌وجوی شماره یا عنوان پرونده…',value:query});
 q.addEventListener('input',function(){query=q.value;renderCases()});
 app.appendChild(q);
 var num=h('input',{placeholder:'شماره پرونده'});
 var ttl=h('input',{placeholder:'عنوان (اختیاری)'});
 var add=h('button',{text:'افزودن پرونده'});
 add.addEventListener('click',async function(){
  var n=num.value.trim();if(!n)return;add.disabled=true;
  var r=await sb.from('cases').insert({number:n,title:ttl.value.trim()});
  if(r.error){toast(r.error.code==='23505'?'این شماره پرونده قبلاً ثبت شده است':'ثبت پرونده انجام نشد')}
  else{num.value='';ttl.value='';await refreshCases()}
  add.disabled=false;
 });
 app.appendChild(h('div',{class:'card'},[num,h('div',{class:'row'},[ttl]),add]));
 app.appendChild(h('div',{id:'cases'}));
 renderCases();
 app.appendChild(h('p',{class:'meta',text:'نسخه ۸ — عکس در یادداشت'}));
}

function renderCases(){
 var box=document.getElementById('cases');if(!box)return;box.textContent='';
 var s=query.trim().toLowerCase();
 var list=cases.filter(function(c){return !s||(c.number||'').toLowerCase().indexOf(s)>-1||(c.title||'').toLowerCase().indexOf(s)>-1});
 if(!list.length){box.appendChild(h('p',{class:'empty',text:cases.length?'پرونده‌ای پیدا نشد':'هنوز پرونده‌ای ثبت نشده است'}));return}
 list.forEach(function(c){
  var isNew=c.last_by&&c.last_by!==me&&new Date(c.last_at).getTime()>seenGet(c.id);
  var top=h('div',{class:'top'},[h('span',{class:'num',text:'پرونده '+c.number+(c.title?' — '+c.title:'')}),isNew?h('span',{class:'badge',text:'جدید'}):null,caseActs(c)]);
  var prev=h('div',{class:'prev',text:c.last_text?c.last_text+' ('+nm(c.last_by)+')':'بدون یادداشت'});
  var meta=h('div',{class:'meta',text:c.last_text?fmt(c.last_at):''});
  box.appendChild(h('div',{class:'card case',onclick:function(){openCase(c.id)}},[top,prev,meta]));
 });
}

async function openCase(id){
 openId=id;notes=[];pending=[];seenSet(id,Date.now());
 renderCase();
 await loadNotes();renderNotes();
}

function renderCase(){
 var c=cases.filter(function(x){return x.id===openId})[0];if(!c){renderList();return}
 app.textContent='';
 app.appendChild(h('button',{class:'ghost',text:'→ بازگشت',onclick:function(){renderList()}}));
 app.appendChild(h('div',{class:'bar'},[h('h1',{text:'پرونده '+c.number+(c.title?' — '+c.title:'')}),caseActs(c)]));
 var ta=h('textarea',{placeholder:'یادداشت جدید…'});
 var btn=h('button',{text:'ثبت یادداشت'});
 var fi=h('input',{type:'file',accept:'image/*',multiple:'multiple',style:'display:none'});
 var addBtn=h('button',{class:'ghost',text:'📷 افزودن عکس'});
 var prevBox=h('div',{class:'thumbs'});
 function renderPrev(){prevBox.textContent='';pending.forEach(function(p,i){
  var x=h('button',{class:'x',text:'×'});
  x.addEventListener('click',function(){URL.revokeObjectURL(p.url);pending.splice(i,1);renderPrev()});
  prevBox.appendChild(h('div',{class:'pv'},[h('img',{src:p.url}),x]))})}
 addBtn.addEventListener('click',function(){fi.click()});
 fi.addEventListener('change',async function(){
  var fl=Array.prototype.slice.call(fi.files||[]);fi.value='';if(!fl.length)return;
  addBtn.disabled=true;toast('در حال آماده‌سازی عکس…');
  for(var i=0;i<fl.length;i++){
   if(pending.length>=10){toast('حداکثر ۱۰ عکس برای هر یادداشت');break}
   try{var b=await shrink(fl[i]);pending.push({blob:b,url:URL.createObjectURL(b)})}catch(e){toast('یکی از عکس‌ها خوانده نشد')}
  }
  addBtn.disabled=false;renderPrev();
 });
 btn.addEventListener('click',async function(){
  var t=ta.value.trim();if(!t&&!pending.length)return;btn.disabled=true;addBtn.disabled=true;
  var paths=[];
  if(pending.length)toast('در حال بارگذاری عکس‌ها…');
  for(var i=0;i<pending.length;i++){
   var path=c.id+'/'+uid()+'.jpg';
   var up=await sb.storage.from(BUCKET).upload(path,pending[i].blob,{contentType:'image/jpeg'});
   if(up.error){toast('بارگذاری عکس انجام نشد: '+up.error.message);await dropFiles(paths);btn.disabled=false;addBtn.disabled=false;return}
   paths.push(path);
  }
  var r=await sb.from('notes').insert({case_id:c.id,body:t||'📷 عکس',images:paths});
  if(r.error){toast('ثبت یادداشت انجام نشد: '+r.error.message);await dropFiles(paths)}
  else{ta.value='';pending.forEach(function(p){URL.revokeObjectURL(p.url)});pending=[];renderPrev();seenSet(c.id,Date.now());await loadNotes();renderNotes()}
  btn.disabled=false;addBtn.disabled=false;
 });
 app.appendChild(h('div',{class:'card'},[ta,h('div',{class:'row'},[addBtn,fi]),prevBox,h('div',{class:'row'},[btn])]));
 app.appendChild(h('div',{id:'notes'}));
}

function renderNotes(){
 var box=document.getElementById('notes');if(!box)return;box.textContent='';
 if(!notes.length){box.appendChild(h('p',{class:'empty',text:'هنوز یادداشتی ثبت نشده است'}));return}
 notes.forEach(function(n,i){
  var card=h('div',{class:'card'});
  var meta=h('div',{class:'meta',text:fmt(n.created_at)+' ('+nm(n.author_id)+')'+(i===0?' • آخرین یادداشت':'')+(n.edited_at?' • ویرایش‌شده':'')});
  var body=h('p',{class:'note',text:n.body});
  var acts=null;
  {
   var del=h('button',{class:'del',text:'حذف'});
   var ed=null;
   if(n.author_id===me){ed=h('button',{class:'ghost',text:'ویرایش'})}
   acts=h('div',{class:'acts'},[ed,del]);
   if(ed)ed.addEventListener('click',function(){
    card.textContent='';
    var ta=h('textarea',{});ta.value=n.body;
    var save=h('button',{text:'ذخیره'});
    var cancel=h('button',{class:'ghost',text:'انصراف'});
    cancel.addEventListener('click',renderNotes);
    save.addEventListener('click',async function(){
     var t=ta.value.trim();if(!t)return;
     if(t===n.body){renderNotes();return}
     save.disabled=true;
     var r=await sb.from('notes').update({body:t,edited_at:new Date().toISOString()}).eq('id',n.id).select();
     if(r.error||!r.data||!r.data.length){toast('ویرایش انجام نشد'+(r.error?': '+r.error.message:''));save.disabled=false;return}
     await loadNotes();renderNotes();await loadCases();toast('یادداشت ویرایش شد');
    });
    card.appendChild(ta);card.appendChild(h('div',{class:'row'},[save,cancel]));
   });
   del.addEventListener('click',async function(){
    if(!confirm('این یادداشت حذف شود؟'))return;
    del.disabled=true;
    var r=await sb.from('notes').delete().eq('id',n.id).select();
    if(r.error||!r.data||!r.data.length){toast('حذف انجام نشد'+(r.error?': '+r.error.message:''));del.disabled=false;return}
    await dropFiles(n.images);await loadNotes();renderNotes();await loadCases();toast('یادداشت حذف شد');
   });
  }
  card.appendChild(body);
  var ims=(n.images||[]).filter(function(x){return urls[x]});
  if(ims.length){var th=h('div',{class:'thumbs'});ims.forEach(function(x){var im=h('img',{src:urls[x],loading:'lazy'});im.addEventListener('click',function(){showImg(urls[x])});th.appendChild(im)});card.appendChild(th)}
  card.appendChild(h('div',{class:'top foot'},[meta,acts]));
  box.appendChild(card);
 });
}

async function onNote(p){
 var n=p.new;if(!n)return;
 await loadProfiles();
 if(openId===n.case_id){await loadNotes();renderNotes();seenSet(openId,Date.now());return}
 await refreshCases();
 if(n.author_id!==me){var c=cases.filter(function(x){return x.id===n.case_id})[0];
  toast(nm(n.author_id)+' در پرونده '+(c?c.number:'')+' یادداشت گذاشت')}
}

function b64(s){var p='='.repeat((4-s.length%4)%4),b=(s+p).replace(/-/g,'+').replace(/_/g,'/'),r=atob(b),o=new Uint8Array(r.length);for(var i=0;i<r.length;i++)o[i]=r.charCodeAt(i);return o}
async function enablePush(){
 try{
  if(!('serviceWorker' in navigator)||!('PushManager' in window)){toast('اعلان روی این مرورگر پشتیبانی نمی‌شود');return}
  var perm=await Notification.requestPermission();
  if(perm!=='granted'){toast('اجازه‌ی اعلان داده نشد');return}
  var reg=await navigator.serviceWorker.ready;
  var sub=await reg.pushManager.getSubscription()||await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64(VAPID_PUBLIC_KEY)});
  var j=sub.toJSON();
  var r=await sb.from('push_subscriptions').upsert({endpoint:j.endpoint,subscription:j,user_id:me},{onConflict:'endpoint'});
  toast(r.error?'ثبت اعلان انجام نشد':'اعلان فعال شد');
 }catch(e){toast('فعال‌سازی اعلان انجام نشد')}
}

async function boot(){
 if('serviceWorker' in navigator){try{navigator.serviceWorker.register('sw.js')}catch(e){}}
 var s=await sb.auth.getSession();
 if(!s.data.session){renderLogin();return}
 me=s.data.session.user.id;
 await loadProfiles();await loadCases();renderList();
 sb.channel('app')
  .on('postgres_changes',{event:'*',schema:'public',table:'cases'},function(){clearTimeout(tmr);tmr=setTimeout(refreshCases,200)})
  .on('postgres_changes',{event:'INSERT',schema:'public',table:'notes'},onNote)
  .on('postgres_changes',{event:'UPDATE',schema:'public',table:'notes'},async function(){if(openId){await loadNotes();renderNotes()}await refreshCases()})
  .on('postgres_changes',{event:'DELETE',schema:'public',table:'notes'},async function(){if(openId){await loadNotes();renderNotes()}await refreshCases()})
  .subscribe();
}
boot();
})();
</script>
</body>
</html>
