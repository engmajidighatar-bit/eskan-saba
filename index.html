:root{--bg:#fafafa;--card:#fff;--text:#18181b;--muted:#8a8f98;--line:#ececef;--accent:#2f6fed;--onaccent:#fff;--new:#dc2626}

.rep .en{border-top:1px solid #ccc;padding:10px 0}

.row{display:flex;gap:8px;margin:8px 0}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px}

.top{display:flex;justify-content:space-between;align-items:center;gap:8px}

.chrow{display:flex;align-items:center;gap:10px}

.bub.new{animation:bubin .22s cubic-bezier(.2,.8,.3,1)}
.bub.mine.new{transform-origin:top right}

@keyframes bubin{from{opacity:0;transform:translateY(14px) scale(.9)}to{opacity:1;transform:none}}
.bub.pend{opacity:.7}
.bub.fail{border-color:#c0392b}

.cmp .row button{flex-shrink:0}

/* ===== نسخه ۱۵: تم مینیمال + چت شبیه تلگرام ===== */
:root{--chatbg:#eef1f4;--bin:#fff;--bout:#dbe9ff;--btext:#18181b;--tick:#2f6fed}
body{font-size:15px;line-height:1.6}
h1{font-size:18px;font-weight:600;margin:6px 0}
button{border-radius:8px;font-size:15px;font-weight:500;padding:9px 16px;transition:opacity .15s,transform .1s}
button:active{transform:scale(.97)}
input,textarea,select{border-radius:8px;outline:none;transition:border-color .15s}

.card{border-radius:10px;padding:12px 14px}
.toast{background:var(--text);color:var(--bg);border-radius:10px;font-size:14px}
.thumbs img{border-radius:6px}
.tbar{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.tbar h1{flex:1;margin:0}

.wrap.chat{max-width:640px;padding:0;min-height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column}
.chead{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:6px 8px;background:var(--card);border-bottom:1px solid var(--line)}
.chead .ct{min-width:0;flex:1}
.chead .cn{font-weight:600;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.dsep{align-self:center;margin:10px 0 6px}
.dsep span{display:inline-block;background:rgba(120,130,145,.22);color:var(--muted);font-size:12px;padding:1px 12px;border-radius:99px}
.bub{max-width:80%;padding:6px 10px 4px;border-radius:14px;background:var(--bin);color:var(--btext);border:0;box-shadow:0 1px 1px rgba(0,0,0,.06);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.bub.mine{background:var(--bout);color:var(--btext);border:0}
.bub.first{margin-top:8px}
.bub.mine.last{border-bottom-right-radius:4px}
.bub:not(.mine).last{border-bottom-left-radius:4px}
.bub:not(.first) .who{display:none}
.bub .who{font-size:13px;font-weight:600;margin-bottom:1px}
.bub .tm{display:flex;justify-content:flex-end;align-items:center;gap:6px;font-size:11px;opacity:.65;margin-top:0;line-height:1.4}
.bub .st{color:var(--tick);font-size:12px}
.bub.fail{outline:1px solid #c0392b}
.bub.mine.new{transform-origin:bottom right}
.bub:not(.mine).new{transform-origin:bottom left}
@keyframes bubin{from{opacity:0;transform:translateY(18px) scale(.9)}to{opacity:1;transform:none}}
.bub img.ph{border-radius:10px}
.cmp{position:sticky;bottom:0;background:transparent;padding:6px 8px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px))}
.cmp .frow{background:var(--card)}
.cbox{display:flex;align-items:flex-end;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:4px}
.cmp .cbox textarea{flex:1;min-height:36px;height:36px;max-height:120px;border:0;background:transparent;padding:7px 6px;resize:none;line-height:1.5;border-radius:0}
.cbox .ibtn{width:38px;height:38px;color:var(--muted)}
.sendb{width:38px;height:38px;padding:0;border-radius:50%;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;background:var(--line);color:var(--muted);transition:background .15s,color .15s,transform .15s}
.sendb .ico{transform:scaleX(-1)}

.sendb.pop{animation:pop .2s ease}
@keyframes pop{50%{transform:scale(.8)}}
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:640px;background:var(--card);border-radius:16px 16px 0 0;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));animation:sheetin .18s ease-out}
@keyframes sheetin{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet .sb{display:block;width:100%;background:transparent;color:var(--text);text-align:right;padding:13px 14px;border-radius:10px;font-size:16px}
.sheet .sb:active{background:var(--line)}
.sheet .sb.dg{color:var(--new)}
/* فهرست چت */
.clist{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.clist .meta{margin:0;padding:8px 14px;background:var(--bg)}
.clist .empty{padding:16px 0}
.crow2{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.crow2:last-child{border-bottom:0}
.crow2:active{background:var(--bg)}
.crow2 .ci{flex:1;min-width:0}
.crt,.crb{display:flex;align-items:center;gap:8px}
.crt .cn{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crt .ctm{font-size:12px;color:var(--muted);flex-shrink:0}
.crb .prev{flex:1;min-width:0;margin-top:0}
.cn.ub,.prev.ub{color:var(--text);font-weight:700}
.udot{width:10px;height:10px;border-radius:50%;background:var(--accent);flex-shrink:0}
/* ===== نسخه ۱۶: ظاهر جدید + انیمیشن ===== */
:root{--bg:#eef7ff;--card:rgba(255,255,255,.74);--text:#12304a;--muted:#6a8399;--line:rgba(56,150,230,.18);--accent:#2a8ae8;--accent2:#38c0ff;--onaccent:#fff;--new:#f0457a;--chatbg:#eef7ff;--bin:rgba(255,255,255,.92);--btext:#12304a;--tick:#fff;--grad:linear-gradient(135deg,#2f86f0 0%,#38aaf8 55%,#5cc8ff 100%);--shadow:0 6px 24px rgba(40,120,200,.10);--shadowh:0 14px 36px rgba(40,120,200,.22);--glow:rgba(42,138,232,.30);--ease:cubic-bezier(.22,1,.36,1);--b1:rgba(56,160,255,.26);--b2:rgba(110,220,255,.24);--b3:rgba(130,170,255,.20)}
html{background:var(--bg)}
body,body.chatbody{background:transparent;font-family:Vazirmatn,Tahoma,"Segoe UI",sans-serif;position:relative}
body::before{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;background:radial-gradient(40% 35% at 20% 15%,var(--b1),transparent 70%),radial-gradient(35% 30% at 85% 25%,var(--b2),transparent 70%),radial-gradient(40% 35% at 60% 90%,var(--b3),transparent 70%);animation:drift 22s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate3d(4%,3%,0) rotate(6deg) scale(1.08)}}
h1{font-size:21px;font-weight:800;background:var(--grad);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:shine 5s ease-in-out infinite alternate}
@keyframes shine{to{background-position:100% 0}}
#app:has(input[type=password]){min-height:80vh;display:flex;flex-direction:column;justify-content:center}
#app:has(input[type=password]) h1{font-size:28px;text-align:center;margin-bottom:14px}

/* کارت‌ها */
.card,.clist{background:var(--card);-webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.card{transition:transform .35s var(--ease),box-shadow .35s var(--ease),border-color .25s}
.case{position:relative;overflow:hidden}
.case::before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:4px;background:var(--grad);transform:scaleY(0);transition:transform .35s var(--ease)}
@media (hover:hover){.case:hover{transform:translateY(-3px);box-shadow:var(--shadowh);border-color:var(--accent)}.case:hover::before{transform:scaleY(1)}.crow2:hover{background:var(--line)}.thumbs img:hover{transform:scale(1.06)}button.ghost:hover{color:var(--accent2)}}
.case:active{transform:scale(.985)}
.thumbs img{transition:transform .3s var(--ease);border-radius:10px}

/* دکمه‌ها */
button{background:var(--grad);background-size:140% 140%;color:#fff;border-radius:14px;font-weight:600;padding:11px 18px;box-shadow:0 6px 18px var(--glow);transition:transform .25s var(--ease),box-shadow .25s,background-position .5s,opacity .2s}
button:not(.x){position:relative;overflow:hidden}
button.ghost,button.del,.ibtn,.sb,.x,.bd,.x2{box-shadow:none}
button.ghost{background:transparent;color:var(--accent)}
@media (hover:hover){button:not(.ghost,.del,.ibtn,.sb,.x,.bd,.x2):hover{transform:translateY(-2px);box-shadow:0 10px 26px var(--glow);background-position:100% 50%}}
button:not(.ghost,.del,.ibtn,.sb,.x,.bd,.x2):active{transform:scale(.96)}
.rpl{position:absolute;border-radius:50%;background:currentColor;opacity:.28;transform:scale(0);animation:rpl .6s ease-out forwards;pointer-events:none}
@keyframes rpl{to{transform:scale(1);opacity:0}}

/* فیلدها */
input,textarea,select{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 14px;transition:border-color .25s,box-shadow .25s}
input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}
.cbox{border-radius:26px;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);transition:border-color .25s,box-shadow .25s}
.cbox:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}
.cbox textarea:focus{box-shadow:none}

/* نشان‌ها */
.badge{background:linear-gradient(135deg,#f0457a,#ff8a5c);animation:badgep 2s infinite}
@keyframes badgep{0%{box-shadow:0 0 0 0 rgba(240,69,122,.55)}70%{box-shadow:0 0 0 8px rgba(240,69,122,0)}100%{box-shadow:0 0 0 0 rgba(240,69,122,0)}}
.udot{background:var(--grad);animation:dotp 2s infinite}
@keyframes dotp{0%{box-shadow:0 0 0 0 var(--glow)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.empty{animation:breathe 2s ease-in-out infinite}
@keyframes breathe{50%{opacity:.5}}

/* ورود صفحه‌ها (با فلگ data-enter که اسکریپت می‌گذارد) */
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
#app[data-enter]>*{animation:up .55s var(--ease) both}
#app[data-enter]>:nth-child(2){animation-delay:.05s}#app[data-enter]>:nth-child(3){animation-delay:.1s}#app[data-enter]>:nth-child(4){animation-delay:.15s}#app[data-enter]>:nth-child(5){animation-delay:.2s}#app[data-enter]>:nth-child(6){animation-delay:.25s}#app[data-enter]>:nth-child(7){animation-delay:.3s}#app[data-enter]>:nth-child(n+8){animation-delay:.35s}
#app[data-enter]>#cases,#app[data-enter]>#notes,#app[data-enter]>.msgs{animation:none}
#app[data-enter] #cases .card,#app[data-enter] #notes .card{animation:up .5s var(--ease) both;animation-delay:.15s}
#app[data-enter] #cases .card:nth-child(2),#app[data-enter] #notes .card:nth-child(2){animation-delay:.2s}
#app[data-enter] #cases .card:nth-child(3),#app[data-enter] #notes .card:nth-child(3){animation-delay:.25s}
#app[data-enter] #cases .card:nth-child(4),#app[data-enter] #notes .card:nth-child(4){animation-delay:.3s}
#app[data-enter] #cases .card:nth-child(5),#app[data-enter] #notes .card:nth-child(5){animation-delay:.35s}
#app[data-enter] #cases .card:nth-child(n+6),#app[data-enter] #notes .card:nth-child(n+6){animation-delay:.4s}
#app[data-enter] .crow2{animation:up .45s var(--ease) both}
#app[data-enter] .crow2:nth-child(3){animation-delay:.06s}#app[data-enter] .crow2:nth-child(4){animation-delay:.12s}#app[data-enter] .crow2:nth-child(5){animation-delay:.18s}#app[data-enter] .crow2:nth-child(n+6){animation-delay:.24s}
#app[data-enter] .msgs>.bub:nth-last-child(-n+8){animation:bubin .45s var(--ease) both}

/* چت */
.chead{-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.bub{border-radius:18px;box-shadow:0 2px 8px rgba(30,90,160,.08)}
.bub.mine{background:var(--grad);color:#fff;box-shadow:0 4px 14px var(--glow)}
.bub.mine .who{color:rgba(255,255,255,.9)}
.bub.new{animation-duration:.45s;animation-timing-function:var(--ease)}
@keyframes bubin{from{opacity:0;transform:translateY(20px) scale(.88)}to{opacity:1;transform:none}}
.dsep span{-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.clist{overflow:hidden}
.clist .meta{background:transparent}
.crow2{transition:background .2s}
.av{background:var(--grad);border:2px solid var(--card);box-shadow:0 0 0 2px var(--accent)}
.sendb.on{background:var(--grad);color:#fff;box-shadow:0 4px 12px var(--glow)}
.sendb.on:not(.pop){animation:sendin .35s var(--ease)}
@keyframes sendin{from{transform:scale(.7) rotate(-20deg)}to{transform:none}}

/* توست، لایت‌باکس، شیت */
.toast{background:var(--grad);color:#fff;border-radius:16px;box-shadow:0 12px 32px var(--glow);font-weight:500;text-align:center;animation:toast 3.5s var(--ease) both}
@keyframes toast{0%{opacity:0;transform:translateY(24px) scale(.96)}8%,92%{opacity:1;transform:none}100%{opacity:0;transform:translateY(16px) scale(.97)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.lb{animation:fade .25s;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.lb img{animation:zoom .4s var(--ease)}

/* بازتاب نرم سطح شیشه */

 background:radial-gradient(120% 75% at 16% 0%,rgba(255,255,255,.36),rgba(255,255,255,0) 56%),radial-gradient(90% 60% at 88% 100%,rgba(255,255,255,.24),rgba(255,255,255,0) 62%)}

 box-shadow:inset 0 1px 0 rgba(255,255,255,.8),inset 0 -1px 0 rgba(255,255,255,.28),inset 0 0 18px rgba(255,255,255,.26),0 16px 30px -10px rgba(18,48,88,.4),0 3px 8px rgba(18,48,88,.12)}}

 background-size:100% 100%;
 box-shadow:inset 0 1px 0 rgba(255,255,255,.75),inset 0 -1px 0 rgba(255,255,255,.26),inset 0 0 18px rgba(160,215,255,.38),0 12px 26px -8px rgba(25,95,225,.58),0 2px 6px rgba(25,95,225,.24)}

 for(var i=0;i<all.length;i++){if(all[i].getAttribute('data-mid')===s)return all[i]}
 return null;
}
function dropMsg(id){
 var el=findBub(id);
 if(el&&el.classList.contains('gone'))return;
 var i=-1;for(var k=0;k<chatMsgs.length;k++){if(chatMsgs[k].id===id){i=k;break}}
 if(i>-1)chatMsgs.splice(i,1);
 if(el&&el.classList.contains('vx'))return;
 if(el){el.classList.add('gone');setTimeout(function(){el.remove();if(!chatMsgs.length)drawMsgs();else relayout()},180)}
}
function hasMsg(id){for(var k=0;k<chatMsgs.length;k++){if(chatMsgs[k].id===id)return true}return false}
async function sendOut(id,t,fl){
 var tmp={sender_id:me,body:t||null,created_at:new Date().toISOString(),pending:true,pfiles:fl};
 var el=(chatRoom===id)?addBub(tmp,true):null;
 cpending++;
 try{
  var rows=[];
  if(!fl.length){
   var r=await sb.from('chat_messages').insert({room_id:id,sender_id:me,body:t}).select().single();
   if(r.error)throw r.error;
   rows.push(r.data);
  }else{
   for(var i=0;i<fl.length;i++){
    var f=fl[i],blob=f,name=f.name,type=f.type||'application/octet-stream';
    if(type.indexOf('image/')===0&&type!=='image/gif'){blob=await shrink(f);type='image/jpeg'}
    var path=id+'/'+uid()+'.'+(type==='image/jpeg'?'jpg':ext(name));
    var up=await sb.storage.from(CB).upload(path,blob,{contentType:type});
    if(up.error)throw up.error;
    var pu=sb.storage.from(CB).getPublicUrl(path).data.publicUrl;
    var r2=await sb.from('chat_messages').insert({room_id:id,sender_id:me,body:(i===0&&t)?t:null,file_url:pu,file_name:name,file_type:type}).select().single();
    if(r2.error)throw r2.error;
    rows.push(r2.data);
   }
  }
  chatLast[id]=rows[rows.length-1];
  if(chatRoom===id){
   if(!fl.length&&el){
    var row=rows[0];
    el.setAttribute('data-mid',String(row.id));
    el.classList.remove('pend');
    var s=el.querySelector('.st');if(s)s.textContent='✓';
    attachMenu(row,el);
    if(!hasMsg(row.id))chatMsgs.push(row);
   }else{
    if(el)el.remove();
    rows.forEach(function(row){if(!hasMsg(row.id)){chatMsgs.push(row);addBub(row,true)}});
   }
  }
 }catch(e){
  if(el&&el.parentNode){
   el.classList.remove('pend');el.classList.add('fail');
   var s2=el.querySelector('.st');if(s2)s2.textContent=' ⚠️ ارسال نشد';
   var rt=h('button',{class:'bd',text:'تلاش دوباره'});
   rt.addEventListener('click',function(){el.remove();sendOut(id,t,fl)});
   el.querySelector('.tm').appendChild(rt);
  }else{toast('ارسال انجام نشد: '+((e&&e.message)||''))}
 }
 cpending--;
}

}

async function onChatMsg(p){

function b64(s){var p='='.repeat((4-s.length%4)%4),b=(s+p).replace(/-/g,'+').replace(/_/g,'/'),r=atob(b),o=new Uint8Array(r.length);for(var i=0;i<r.length;i++)o[i]=r.charCodeAt(i);return o}
async function enablePush(quiet){
 var say=function(t){if(!quiet)toast(t)};
 try{
  if(!('serviceWorker' in navigator)||!('PushManager' in window)){say('اعلان روی این مرورگر پشتیبانی نمی‌شود');return}
  var perm=await Notification.requestPermission();
  if(perm!=='granted'){say('اجازه‌ی اعلان داده نشد');return}
  var reg=await navigator.serviceWorker.ready;
  var sub=await reg.pushManager.getSubscription()||await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64(VAPID_PUBLIC_KEY)});
  var j=sub.toJSON();
  var r=await sb.from('push_subscriptions').upsert({endpoint:j.endpoint,subscription:j,user_id:me},{onConflict:'endpoint'});
  say(r.error?'ثبت اعلان انجام نشد':'اعلان فعال شد');
 }catch(e){say('فعال‌سازی اعلان انجام نشد')}
}
function autoPush(){
 try{
  if(!VAPID_PUBLIC_KEY||!window.Notification||!('serviceWorker' in navigator)||!('PushManager' in window))return;
  if(Notification.permission==='granted'){enablePush(true);return}
  if(Notification.permission==='default'){
   var go=function(){document.removeEventListener('click',go,true);enablePush(true)};
   document.addEventListener('click',go,true);
  }
 }catch(e){}
}

function s2(p,t){s1(p,tN);var bx=rx,by=ry,ba=ra,u=sm(tN+p.d2,tN+p.d2+1200,t),fx=W/2+p.nx,fy=CY+p.ny,q=Math.sin(u*3.1416)*p.sw*26,j=.5*u*Math.sin(t/260+p.ph);
 rx=bx+(fx-bx)*u+q+j;ry=by+(fy-by)*u-q*.5+j*.7;ra=ba+(.95-ba)*u}
function sph(p,t){var s=p.sp,r=t/900,x1=s[0]*Math.cos(r)+s[2]*Math.sin(r),z1=-s[0]*Math.sin(r)+s[2]*Math.cos(r),ex=sm(tE,tE+1100,t),R=Math.min(W*.24,96),sc=R*(1+.05*Math.sin(s[1]*5+t/400))*(1+ex*(1+s[3]*2.4));
 rx=W/2+x1*sc;ry=H*.42+s[1]*sc;ra=(.35+.5*(z1+1)/2)*(1-ex)}
function s3(p,t){var u=sm(tS+p.d3,tS+p.d3+1500,t),bx=W/2+p.nx,by=CY+p.ny;sph(p,t);var q=Math.sin(u*3.1416)*p.sw*30;rx=bx+(rx-bx)*u+q;ry=by+(ry-by)*u-q*.5;ra=.95+(ra-.95)*u}
function orbPos(o,t){return[ORB[o][1]*W+Math.sin(t/1300+o*2)*6,ORB[o][2]*H*.9+Math.cos(t/1100+o)*6]}
function burst(p,t){var o=orbPos(p.o,t),u=sm(tB+p.d3*.5,tB+p.d3*.5+1200,t),r=(20+Math.abs(p.sw)*170)*u;rx=o[0]+Math.cos(p.an)*r;ry=o[1]+Math.sin(p.an)*r;ra=(1-u)*.8}
function at(p,t){if(t<tN)s1(p,t);else if(t<tS)s2(p,t);else s3(p,t)}

function frame(now){
 if(!running)return;
 var t=(now-t0)*SPD;
 ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
 /* typed text + wave (same as the original intro) */
 if(t<tD){
  var n=Math.min(PH.length,Math.floor(Math.max(0,t-300)/70)),str=PH.slice(0,n),cut=str.lastIndexOf(' '),xr=W/2+FW/2;
  ctx.font='300 19px '+FONT;ctx.textBaseline='middle';ctx.textAlign='right';
  if(n<PH.length&&cut>=0){var pa=str.slice(0,cut+1);ctx.fillStyle='#1d2029';ctx.fillText(pa,xr,CY);ctx.fillStyle='#a3a7b2';ctx.fillText(str.slice(cut+1),xr-ctx.measureText(pa).width,CY)}
  else{ctx.fillStyle='#1d2029';ctx.fillText(str,xr,CY)}}
 var talking=t<3000&&t>300,wa=1-sm(3300,3900,t),y0=H*.76;
 amp+=((talking?16+14*Math.abs(Math.sin(t/130)*Math.sin(t/310+1)):3)-amp)*.15;
 if(wa>0){ctx.globalAlpha=wa;
  for(var Lr=0;Lr<3;Lr++){ctx.beginPath();
   for(var x=0;x<=W;x+=4){var q=x/W,env=Math.exp(-Math.pow((q-.5)*3.4,2)),yy=y0+Math.sin(q*9+t/(520+Lr*170)+Lr*2.1)*amp*env*(1-Lr*.22)*(Lr%2?-1:1);x?ctx.lineTo(x,yy):ctx.moveTo(x,yy)}
   ctx.strokeStyle='rgba(28,30,42,'+(.6-Lr*.14)+')';ctx.lineWidth=1;ctx.stroke()}
  ctx.beginPath();ctx.moveTo(0,y0);ctx.lineTo(W,y0);ctx.strokeStyle='rgba(28,30,42,.3)';ctx.stroke();ctx.globalAlpha=1}
 /* powder particles: text -> dust -> "Note" -> sphere -> burst */
 if(t>=tD){ctx.fillStyle='rgb(29,32,41)';
  for(var i=0;i<M;i++){var p=P[i];at(p,t);if(ra>.02){ctx.globalAlpha=ra;ctx.fillRect(rx,ry,p.sz,p.sz)}}ctx.globalAlpha=1}
 /* enter the app */
 if(t>tE+500&&!out){out=1;intro.classList.add('out')}
 if(t>tE+1800){running=0;removeEventListener('resize',build);intro.remove();return}
 requestAnimationFrame(frame)}
function start(){out=0;amp=3;running=1;t0=performance.now();requestAnimationFrame(frame)}
/* tap = jump to the next page of the intro */
intro.addEventListener('pointerdown',function(){var t=(performance.now()-t0)*SPD,B=[tD,tS,tE];for(var i=0;i<B.length;i++)if(B[i]>t+150){t0=performance.now()-B[i]/SPD;return}});
addEventListener('resize',build);
build();start();
};
</script>
